<!DOCTYPE html>
<!--
  web/static/scoreboard/index.html — the organiser's scoreboard.

  Names and times, ranked, live. Read on a laptop or a phone by whoever is
  running the prize — not a screen in the container and not a screen the
  public sees.

  THIS PAGE DELIBERATELY IGNORES display.hide_times.

  That is its entire reason to exist. /display/in and /display/out are sealed
  for a grand-prize final so nobody in the queue knows what there is to beat;
  somebody still has to be able to read the times and award the thing. The
  GM console and the admin portal already show them, but the console is busy
  with a run and the admin portal needs a password and shows forty other
  things. This is the one view that is just the answer.

  Because of that, DO NOT put this on a screen anyone can see during a sealed
  final, and do not link it from the display pages. It is served
  unauthenticated, like /gm — see docs/grand-prize.md.

  Live over the same WebSocket the displays use, seeded from
  /api/admin/leaderboard so a reload lands on the right answer immediately
  rather than waiting for the next broadcast. Both are day-scoped server-side
  (SCANMANIA_DAY_START_HOUR), so the 09:00 rollover is handled for us.

  One row per PLAYER, not per run — persist.db.get_leaderboard groups by
  player and keeps their best clean run. Busted and aborted runs never appear:
  a time nobody completed is not a score.

  No build step, no CDN: a venue with no internet must still render this.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanMania — Scoreboard</title>
  <link rel="stylesheet" href="/static/shared/brand.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--sm-black);
      color: #fff;
      font-family: var(--sm-font);
      -webkit-font-smoothing: antialiased;
    }

    #wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ---- header --------------------------------------------------------- */
    header { margin-bottom: 22px; }
    .logo { width: min(60vw, 300px); display: block; }

    h1 {
      font-weight: 900;
      font-size: clamp(26px, 6vw, 40px);
      letter-spacing: 0.02em;
      margin-top: 14px;
    }
    .meta {
      margin-top: 6px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sm-dim);
    }

    /* A standing reminder of what this page is, because it is the one view
       that shows times while the public screens are sealed. Only rendered
       when the seal is actually on — the rest of the time it is noise. */
    #sealNote {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border: 2px solid var(--sm-red);
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.06em;
      line-height: 1.45;
      color: #fff;
    }
    #sealNote.on { display: block; }

    /* ---- the board ------------------------------------------------------ */
    #rows { margin-top: 24px; }

    .row {
      display: grid;
      grid-template-columns: 2.6em 1fr auto;
      align-items: baseline;
      gap: 14px;
      padding: 14px 4px;
      border-bottom: 1px solid #1b1f26;
      font-size: clamp(18px, 4.4vw, 26px);
      font-weight: 700;
    }
    .row.top { font-size: clamp(22px, 5.4vw, 34px); font-weight: 900; }
    .row .pos { color: var(--sm-dim); font-weight: 800; }
    .row.top .pos { color: var(--sm-red); }
    .row .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .row .tm {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .empty {
      padding: 40px 4px;
      color: var(--sm-dim);
      font-weight: 700;
      font-size: 18px;
    }

    footer {
      margin-top: 22px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sm-dim);
    }

    /* Small and low — this is for whoever is holding the laptop, not a
       spectator, so it never takes over the page. */
    #conn {
      display: none;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sm-red);
    }
    #conn.visible { display: block; }
  </style>
</head>
<body>

<div id="wrap">
  <header>
    <img class="logo" src="/static/shared/scanmania-design/sm-text-tp.png" alt="ScanMania">
    <h1>Scoreboard</h1>
    <div class="meta" id="meta">Loading…</div>
    <div id="sealNote">
      The public screens are sealed — they are showing no times at all.
      This page is the exception. Keep it off any screen the queue can see.
    </div>
  </header>

  <div id="rows"><div class="empty">Loading…</div></div>

  <footer id="count"></footer>
  <div id="conn">Reconnecting</div>
</div>

<script>
  "use strict";

  const rowsEl  = document.getElementById("rows");
  const metaEl  = document.getElementById("meta");
  const countEl = document.getElementById("count");
  const sealEl  = document.getElementById("sealNote");
  const connEl  = document.getElementById("conn");

  /* Same formatting as the displays, so a time read here matches a time read
     anywhere else to the centisecond. */
  function fmt(ms) {
    if (ms == null || isNaN(ms)) return "—";
    const t = Math.max(0, Math.floor(ms));
    const m = Math.floor(t / 60000);
    const s = Math.floor((t % 60000) / 1000);
    const c = Math.floor((t % 1000) / 10);
    return String(m).padStart(2, "0") + ":" +
           String(s).padStart(2, "0") + "." +
           String(c).padStart(2, "0");
  }

  let lastSig = null;

  function render(entries) {
    const list = entries || [];
    // Guard on a signature: this runs on every broadcast (~10 Hz) for a list
    // that changes a few times an hour.
    const sig = JSON.stringify(list.map(e => [e.player_nickname, e.elapsed_ms]));
    if (sig === lastSig) return;
    lastSig = sig;

    rowsEl.textContent = "";
    if (!list.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "No clean runs yet today.";
      rowsEl.append(d);
      countEl.textContent = "";
      return;
    }

    list.forEach((e, i) => {
      // textContent, never innerHTML: a nickname is public input, typed at
      // sign-in by whoever is on the iPad.
      const row = document.createElement("div");
      row.className = "row" + (i === 0 ? " top" : "");
      const pos = document.createElement("span");
      pos.className = "pos";
      pos.textContent = (i + 1) + ".";
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = e.player_nickname || "—";
      const tm = document.createElement("span");
      tm.className = "tm";
      tm.textContent = fmt(e.elapsed_ms);
      row.append(pos, nm, tm);
      rowsEl.append(row);
    });

    countEl.textContent = list.length === 1
      ? "1 player · best clean run each"
      : `${list.length} players · best clean run each`;
  }

  /* Seed immediately so a reload shows the answer without waiting for the
     next broadcast. */
  async function seed() {
    try {
      const r = await fetch("/api/admin/leaderboard");
      if (!r.ok) return;
      const d = await r.json();
      const rows = Array.isArray(d) ? d : (d.leaderboard || d.runs || []);
      metaEl.textContent = (d.scope ? d.scope + " · " : "") + "clean runs, fastest first";
      render(rows);
    } catch (e) { /* the WebSocket will fill it in */ }
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => connEl.classList.remove("visible");
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (Array.isArray(msg.leaderboard)) render(msg.leaderboard);
      // Mirror the seal only to warn about it. The board above is rendered
      // either way — that is the point of this page.
      sealEl.classList.toggle("on", !!msg.hide_times);
    };
    ws.onclose = () => {
      connEl.classList.add("visible");
      setTimeout(connect, 2000);
    };
    ws.onerror = () => ws.close();
  }

  seed();
  connect();
</script>

</body>
</html>
