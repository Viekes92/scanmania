<!DOCTYPE html>
<!--
  web/static/display_in/index.html — the in-container screen (HDMI-1, 16:9).

  Seen by the player, from inside the container, at a few metres and through
  haze. So: one idea per scene, type as large as it will go, and nothing that
  needs reading twice.

  Brand tokens and the Proxima Nova faces come from /static/shared/brand.css.
  The laser lines are supplied artwork rather than drawn, so they match the
  printed collateral exactly.

  The stopwatch is interpolated between broadcasts and hard-corrected on every
  message (invariant 2). Nothing here computes a duration from wall clock.

  No external dependencies, no build step, no webfont CDN — a venue with no
  internet must still render correctly.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanMania — In-container display</title>
  <link rel="stylesheet" href="/static/shared/brand.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--sm-black);
      color: #fff;
      font-family: var(--sm-font);
      overflow: hidden;
      cursor: none;                /* it is a screen, not a computer */
      -webkit-font-smoothing: antialiased;
    }

    .sm-lasers { background-image: url("/static/shared/scanmania-design/lasers-h.png"); }

    #stage {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 4vh 5vw;
    }

    .scene { display: none; width: 100%; }
    .scene.active { display: block; }

    /* ---- logo ---------------------------------------------------------- */
    .logo { width: min(62vw, 1500px); display: block; margin: 0 auto; }
    .logo.small { width: min(34vw, 780px); }

    /* ---- headline type -------------------------------------------------- */
    .tagline {
      font-weight: 700;
      font-size: clamp(28px, 6.2vw, 150px);
      color: var(--sm-red);
      margin-top: 2.2vh;
      line-height: 1;
    }
    .tagline.blue { color: var(--sm-blue); }

    .eyebrow {
      font-weight: 700;
      font-size: clamp(16px, 2.2vw, 54px);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--sm-blue);
    }

    .name {
      font-weight: 900;
      font-size: clamp(40px, 11vw, 260px);
      line-height: 0.95;
      word-break: break-word;
      margin-top: 1vh;
    }

    /* ---- the clock -------------------------------------------------------
       Two-tone, as in the artwork: the minutes sit back in blue and the
       seconds carry in red, so the part that is actually moving is the part
       that reads from across the container.                               */
    .clock {
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      font-size: clamp(64px, 21vw, 520px);
      line-height: 0.9;
      letter-spacing: -0.01em;
    }
    .clock .mm { color: var(--sm-blue); }
    .clock .ss { color: var(--sm-red); }
    .clock.small { font-size: clamp(48px, 12vw, 300px); }

    /* ---- countdown ------------------------------------------------------ */
    .cd-number {
      font-weight: 900;
      font-size: clamp(120px, 44vw, 1100px);
      line-height: 0.85;
      color: var(--sm-red);
      font-variant-numeric: tabular-nums;
    }
    #cdRingFill {
      height: 1.4vh;
      background: var(--sm-blue);
      width: 0%;
      margin: 3vh auto 0;
      max-width: 62vw;
      transition: width 120ms linear;
    }

    /* ---- verdicts ------------------------------------------------------- */
    .verdict {
      font-weight: 900;
      font-size: clamp(56px, 16vw, 380px);
      line-height: 0.9;
      letter-spacing: -0.01em;
    }
    .verdict.win  { color: var(--sm-blue); }
    .verdict.lose { color: var(--sm-red); }

    .rank {
      font-weight: 800;
      font-size: clamp(22px, 4vw, 100px);
      color: var(--sm-blue);
      margin-top: 1.5vh;
      letter-spacing: 0.06em;
    }

    .segment {
      font-weight: 700;
      font-size: clamp(16px, 2.4vw, 58px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--sm-blue);
      margin-top: 2vh;
    }
    .segment.flash { animation: seg-flash 0.5s ease-out; }
    @keyframes seg-flash {
      0%   { color: #fff; transform: scale(1.14); }
      100% { color: var(--sm-blue); transform: scale(1); }
    }

    .arm-pulsing { animation: arm-pulse 1.1s ease-in-out infinite; }
    @keyframes arm-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    #waitingText.fault { color: var(--sm-red); }

    /* ---- connection badge ------------------------------------------------
       Small and low. A player should never be told about our WebSocket; this
       is for whoever is standing next to the screen.                       */
    #reconnectBadge {
      position: fixed;
      left: 1.6vw; bottom: 1.6vh;
      z-index: 3;
      display: none;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sm-red);
      border: 2px solid var(--sm-red);
      padding: 5px 12px;
    }
    #reconnectBadge.visible { display: block; }
  </style>
</head>
<body>

<div class="sm-lasers"></div>

<div id="stage">

  <!-- BOOT / SELF_TEST / RESET / MASTER / FAULT -->
  <section class="scene active" id="sceneWaiting">
    <img class="logo" src="/static/shared/scanmania-design/sm-text-tp.png" alt="ScanMania">
    <div class="tagline" id="waitingText">LASER MAZE INITIALIZING</div>
  </section>

  <!-- ATTRACT -->
  <section class="scene" id="sceneAttract">
    <img class="logo" src="/static/shared/scanmania-design/sm-text-tp.png" alt="ScanMania">
    <div class="tagline blue">STEP UP TO PLAY</div>
  </section>

  <!-- REGISTERED / ARM -->
  <section class="scene" id="sceneRegistered">
    <img class="logo small" src="/static/shared/scanmania-design/sm-text-tp.png" alt="ScanMania">
    <div class="eyebrow" id="welcomeLabel">WELCOME</div>
    <div class="name" id="welcomeName">—</div>
  </section>

  <!-- COUNTDOWN -->
  <section class="scene" id="sceneCountdown">
    <div class="cd-number" id="cdStep">3</div>
    <div id="cdRingFill"></div>
  </section>

  <!-- RUNNING -->
  <section class="scene" id="sceneRun">
    <div class="clock" id="runStopwatch"><span class="mm">00:</span><span class="ss">00.00</span></div>
    <div class="segment" id="runSegment">Segment 1 / 3</div>
  </section>

  <!-- BUSTED -->
  <section class="scene" id="sceneBusted">
    <div class="verdict lose">BUSTED</div>
    <div class="clock small" id="bustedTime"><span class="mm">00:</span><span class="ss">00.00</span></div>
  </section>

  <!-- FINISHED -->
  <section class="scene" id="sceneFinished">
    <div class="verdict win">CLEAN RUN</div>
    <div class="name" id="finishedName"></div>
    <div class="clock small" id="finishedTime"><span class="mm">00:</span><span class="ss">00.00</span></div>
  </section>

  <!-- RESULT -->
  <section class="scene" id="sceneResult">
    <div class="eyebrow">YOUR TIME</div>
    <div class="clock" id="resultTime"><span class="mm">00:</span><span class="ss">00.00</span></div>
    <div class="rank" id="resultRank"></div>
  </section>

  <!-- ABORTED -->
  <section class="scene" id="sceneAborted">
    <div class="verdict lose">RUN ENDED</div>
    <div class="clock small" id="abortedTime"><span class="mm">00:</span><span class="ss">00.00</span></div>
  </section>

</div>

<div id="reconnectBadge">Reconnecting</div>

<script>
  "use strict";

  const RUN_STATES = new Set(["RUN_SEG_1", "RUN_SEG_2", "RUN_SEG_3"]);
  const COUNTDOWN_TOTAL = 8;

  const welcomeName    = document.getElementById("welcomeName");
  const welcomeLabel   = document.getElementById("welcomeLabel");
  const cdStep         = document.getElementById("cdStep");
  const cdRingFill     = document.getElementById("cdRingFill");
  const runStopwatch   = document.getElementById("runStopwatch");
  const runSegment     = document.getElementById("runSegment");
  const bustedTime     = document.getElementById("bustedTime");
  const finishedName   = document.getElementById("finishedName");
  const finishedTime   = document.getElementById("finishedTime");
  const resultTime     = document.getElementById("resultTime");
  const resultRank     = document.getElementById("resultRank");
  const abortedTime    = document.getElementById("abortedTime");
  const reconnectBadge = document.getElementById("reconnectBadge");
  const waitingText    = document.getElementById("waitingText");

  /* -----------------------------------------------------------------------
     Stopwatch — interpolated between broadcasts, hard-corrected on each one.

     performance.now() only ever measures the gap SINCE the last message, so
     its rate error cannot accumulate across a two-month kiosk session, and
     nothing here reads a wall clock (invariant 2).
  ----------------------------------------------------------------------- */
  let swElapsedAtMsg = 0;
  let swClientAtMsg  = 0;
  let swRunning      = false;
  let rafId          = null;

  function fmtParts(ms) {
    if (ms == null || isNaN(ms)) ms = 0;
    const total = Math.max(0, Math.floor(ms));
    const m  = Math.floor(total / 60000);
    const s  = Math.floor((total % 60000) / 1000);
    const cs = Math.floor((total % 1000) / 10);
    return [
      String(m).padStart(2, "0") + ":",
      String(s).padStart(2, "0") + "." + String(cs).padStart(2, "0"),
    ];
  }

  /* Two-tone, as in the artwork. Written into two spans whose text is set
     separately — never innerHTML, so a value can never become markup. */
  function setClock(el, ms) {
    const [mm, ss] = fmtParts(ms);
    let a = el.querySelector(".mm"), b = el.querySelector(".ss");
    if (!a || !b) {
      el.textContent = "";
      a = document.createElement("span"); a.className = "mm";
      b = document.createElement("span"); b.className = "ss";
      el.append(a, b);
    }
    if (a.textContent !== mm) a.textContent = mm;
    if (b.textContent !== ss) b.textContent = ss;
  }

  function getInterpolatedMs() {
    if (!swRunning) return swElapsedAtMsg;
    return swElapsedAtMsg + (performance.now() / 1000 - swClientAtMsg) * 1000;
  }

  function tick() {
    setClock(runStopwatch, getInterpolatedMs());
    rafId = swRunning ? requestAnimationFrame(tick) : null;
  }
  function startInterpolation() { if (!rafId) rafId = requestAnimationFrame(tick); }
  function stopInterpolation()  { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

  /* --------------------------------------------------------------------- */
  const SCENES = ["waiting", "attract", "registered", "countdown", "run",
                  "busted", "finished", "result", "aborted"];
  let currentScene = null;

  function showScene(name) {
    if (name === currentScene) return;          // no needless style recalcs
    currentScene = name;
    for (const s of SCENES) {
      const el = document.getElementById("scene" + s[0].toUpperCase() + s.slice(1));
      if (el) el.classList.toggle("active", s === name);
    }
  }

  function setRingProgress(step, total) {
    const pct = total > 0 ? Math.min(100, Math.max(0, (step / total) * 100)) : 0;
    cdRingFill.style.width = pct + "%";
  }

  let lastSegment = null;

  function applyState(msg) {
    const state = msg.state || "ATTRACT";

    swElapsedAtMsg = msg.elapsed_ms || 0;
    swClientAtMsg  = performance.now() / 1000;

    if (state === "REGISTERED") {
      swRunning = false; stopInterpolation();
      welcomeName.textContent = msg.player_nickname || "—";
      welcomeLabel.textContent = "WELCOME";
      welcomeLabel.classList.remove("arm-pulsing");
      showScene("registered");

    } else if (state === "ARM") {
      swRunning = false; stopInterpolation();
      welcomeName.textContent = msg.player_nickname || "—";
      welcomeLabel.textContent = "GET READY";
      welcomeLabel.classList.add("arm-pulsing");
      showScene("registered");

    } else if (state === "ATTRACT") {
      swRunning = false; stopInterpolation();
      showScene("attract");

    } else if (state === "COUNTDOWN") {
      swRunning = false; stopInterpolation();
      showScene("countdown");
      const step  = msg.countdown_step  ?? 0;
      const total = msg.countdown_total ?? COUNTDOWN_TOTAL;
      // Seconds to GO, not the pulse index. The ramp accelerates, so counting
      // pulses raced 8→1 through a 3 s window. Clamped to 1 so the last frame
      // before RUN never flashes a "0".
      cdStep.textContent = Math.max(1, Math.ceil((msg.countdown_remaining_ms ?? 0) / 1000));
      setRingProgress(step, total);

    } else if (RUN_STATES.has(state)) {
      swRunning = true;
      showScene("run");
      const seg = msg.segment || 1;
      runSegment.textContent = `Segment ${seg} / 3`;
      if (seg !== lastSegment) {
        lastSegment = seg;
        runSegment.classList.remove("flash");
        void runSegment.offsetWidth;            // force reflow to restart it
        runSegment.classList.add("flash");
        setTimeout(() => runSegment.classList.remove("flash"), 500);
      }
      startInterpolation();

    } else if (state === "BUSTED") {
      swRunning = false; stopInterpolation();
      showScene("busted");
      setClock(bustedTime, swElapsedAtMsg);

    } else if (state === "FINISHED") {
      swRunning = false; stopInterpolation();
      showScene("finished");
      finishedName.textContent = msg.player_nickname || "";
      setClock(finishedTime, swElapsedAtMsg);

    } else if (state === "RESULT") {
      swRunning = false; stopInterpolation();
      showScene("result");
      setClock(resultTime, swElapsedAtMsg);
      resultRank.textContent = msg.rank != null ? `RANK #${msg.rank}` : "";

    } else if (state === "ABORTED") {
      swRunning = false; stopInterpolation();
      showScene("aborted");
      setClock(abortedTime, swElapsedAtMsg);

    } else {
      /* RESET, FAULT, SELF_TEST, MASTER, BOOT */
      swRunning = false; stopInterpolation();
      const faulted = state === "FAULT";
      waitingText.classList.toggle("fault", faulted);
      waitingText.textContent =
        faulted                                       ? "SYSTEM FAULT — FETCH STAFF"
        : state === "MASTER"                          ? "SYSTEM CHECK IN PROGRESS"
        : (state === "BOOT" || state === "SELF_TEST") ? "LASER MAZE INITIALIZING"
        : "STANDBY";
      showScene("waiting");
    }
  }

  /* -----------------------------------------------------------------------
     WebSocket
  ----------------------------------------------------------------------- */
  let ws = null;
  let wsDelay = 1000;

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      wsDelay = 1000;
      reconnectBadge.classList.remove("visible");
    };

    ws.onmessage = (evt) => {
      __noteMessage();
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }
      applyState(msg);
    };

    ws.onclose = () => {
      // Freeze the clock. A frozen clock is honest. A running one is a lie:
      // with no server left to hard-correct against it drifts, and it keeps
      // counting after the run has already ended.
      swRunning = false;
      stopInterpolation();
      reconnectBadge.classList.add("visible");
      setTimeout(connect, wsDelay);
      wsDelay = Math.min(wsDelay * 2, 10000);
    };

    ws.onerror = () => ws.close();
  }

  connect();

  /* -----------------------------------------------------------------------
     Stale-data watchdog

     onclose is not enough. If the server's broadcaster dies, or the path
     half-opens, the socket stays "healthy" and the screen freezes silently on
     its last frame — in front of a player, for as long as nobody notices.
  ----------------------------------------------------------------------- */
  let __lastMsgAt = Date.now();
  function __noteMessage() { __lastMsgAt = Date.now(); }
  setInterval(() => {
    // The server broadcasts at 10 Hz; 3 s of silence is not a slow frame.
    if (Date.now() - __lastMsgAt > 3000) {
      try { if (ws && ws.readyState === WebSocket.OPEN) ws.close(); } catch (e) {}
    }
  }, 1000);
</script>
</body>
</html>
