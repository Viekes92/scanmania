shows:
  attract:
    description: "idle sparkle — the grid lit, a few channels winking out"
    loop: true
    steps:
    # sparkle_off drops N channels chosen fresh each step, so only those few
    # relays move: 2*N operations per step instead of a full on/off cycle. At
    # ~1.8 s that is a handful of relay operations a second across 45 channels,
    # which is what makes it safe to leave running all day.
    - {preset: all_on, sparkle_off: 4, hold_ms: 1800}
    - {preset: all_on, sparkle_off: 6, hold_ms: 1800}
    - {preset: all_on, sparkle_off: 3, hold_ms: 2200}
    - {preset: all_on, sparkle_off: 7, hold_ms: 1800}
  # The VERDICT, then dark. Both of these used to loop a solid preset, so the
  # maze stayed lit from the stop button until RESET — result_display_ms twice
  # over, 30 s of a fully lit container with nobody in it. The shape is the
  # verdict and it only has to be read once; holding it past that is what made
  # the house-light flash look like a flash into permanent light.
  #
  # hold_ms is the read time — tune it here or in Admin -> Shows.
  bust:
    loop: false
    description: "busted \u2014 horizontals bar the maze, then dark"
    steps:
    - preset: horizontal
      hold_ms: 2500
    - preset: blackout
      hold_ms: 100
  clean:
    loop: false
    description: "clean run \u2014 verticals read as passable, then dark"
    steps:
    - preset: vertical
      hold_ms: 2500
    - preset: blackout
      hold_ms: 100
  main_game:
    segments:
    - maze_1
    - maze_2
    - maze_3
    description: the three mazes in order
  test_show:
    steps:
    - preset: all_on
      hold_ms: 200
    loop: true
light_cues:
  master:
    description: "GM is in the container — working light, entrance lit"
    steps:
    - {left: 255, right: 255, entrance: 255, ms: 0}
  self_test:
    description: "boot probe \u2014 up, so the box is not dark while it checks"
    steps:
    - left: 120
      right: 120
      ms: 0
  reset:
    description: "transient on the way to attract \u2014 hold, do not blink"
    steps:
    - left: 60
      right: 60
      ms: 0
  attract:
    description: "idle — both sides breathing together, entrance lit"
    loop: true
    steps:
    # entrance ON. The cue table is the ONLY thing that sets it now, so a
    # state that does not name it inherits whatever the last one left —
    # and every state from sign-in to the result deliberately sets it to 0.
    # Without it here, the first run of the day took the entrance dark and
    # it never came back.
    - {left: 6, right: 6, entrance: 255, ms: 2600}
    - {left: 1, right: 1, entrance: 255, ms: 2600}
  registered:
    description: "player signed in — entrance dark, we have left attract"
    loop: true
    steps:
    # Entrance OFF from here on. It leaks straight down the container, and
    # everything from sign-in to the result is meant to be read by laser light.
    # It comes back in ATTRACT, MASTER and FAULT — the states where somebody is
    # walking in or out.
    - {left: 20, right: 20, entrance: 0, ms: 1400}
    - {left: 8, right: 8, entrance: 0, ms: 1400}
  arm:
    description: "on the plate — the box goes dark around the player"
    steps:
    # Entrance included: it leaks badly down the container, and from the plate
    # that glow is the only thing telling you where the walls are. The lasers
    # of preset arm_box are meant to be all you can see.
    - {left: 0, right: 0, entrance: 0, ms: 0}
  finished:
    description: "clean run — flash, then hard off so the lasers read"
    steps:
    - {left: 150, right: 150, ms: 90, fade: false}
    - {left: 0, right: 0, ms: 90, fade: false}
    - {left: 150, right: 150, ms: 90, fade: false}
    - {left: 0, right: 0, ms: 90, fade: false}
    - {left: 150, right: 150, ms: 90, fade: false}
    # OFF, and hard. A fade leaves the room half-lit for a second, which is
    # exactly when the player looks up at the 18 vertical curtains — and a
    # half-lit room is the one condition in which you cannot read them.
    - {left: 0, right: 0, entrance: 0, ms: 0, fade: false}
  busted:
    description: "busted — one hard snap, then off so the bars read"
    steps:
    - {left: 150, right: 150, ms: 140, fade: false}
    - {left: 0, right: 0, entrance: 0, ms: 0, fade: false}
  aborted:
    description: "run cut short — entrance lit, someone is coming out"
    steps:
    - {left: 40, right: 40, entrance: 255, ms: 0}
  result:
    description: "score on screen — room stays dark, the maze is the light"
    steps:
    - {left: 0, right: 0, entrance: 0, ms: 0, fade: false}
  fault:
    description: "something is wrong — entrance lit so people can get out"
    loop: true
    steps:
    - {left: 60, right: 60, entrance: 255, ms: 700}
    - {left: 15, right: 15, entrance: 255, ms: 700}