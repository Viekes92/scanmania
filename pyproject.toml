[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scanmania"
version = "1.0.0"
description = "ScanMania laser maze game system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pymodbus>=3.6.0",
    "pyserial-asyncio>=0.6",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
py-modules = ["__main__", "dev_server"]
packages = [
    "config",
    "core",
    "inputs",
    "iobackend",
    "persist",
    "scanmania",
    "tools",
    "vision",
    "web",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
