shows:
  attract:
    description: "idle sparkle \u2014 plays during ATTRACT state"
    steps:
    - preset: all_on
      hold_ms: 2000
    - preset: blackout
      hold_ms: 300
    loop: true
  bust:
    loop: true
    description: "busted \u2014 horizontals solid, the maze reads as barred"
    steps:
    - preset: horizontal
      hold_ms: 5000
  clean:
    loop: true
    description: "clean run \u2014 verticals solid, the maze reads as passable"
    steps:
    - preset: vertical
      hold_ms: 5000
  main_game:
    segments:
    - maze_1
    - maze_2
    - maze_3
    description: the three mazes in order
  test_show:
    steps:
    - preset: all_on
      hold_ms: 200
    loop: true
light_cues:
  master:
    description: "GM is in the container \u2014 full working light"
    steps:
    - left: 255
      right: 255
      ms: 0
  self_test:
    description: "boot probe \u2014 up, so the box is not dark while it checks"
    steps:
    - left: 120
      right: 120
      ms: 0
  reset:
    description: "transient on the way to attract \u2014 hold, do not blink"
    steps:
    - left: 60
      right: 60
      ms: 0
  attract:
    description: "slow alternating pulse, very dim \u2014 the room is idle"
    loop: true
    steps:
    - left: 14
      right: 2
      ms: 1600
    - left: 2
      right: 14
      ms: 1600
  registered:
    description: "player signed in \u2014 both sides up a little, waiting"
    loop: true
    steps:
    - left: 30
      right: 30
      ms: 1200
    - left: 12
      right: 12
      ms: 1200
  arm:
    description: "on the plate \u2014 steady low, about to go dark"
    steps:
    - left: 20
      right: 20
      ms: 0
  finished:
    description: "clean run \u2014 celebratory flash, then settle low"
    steps:
    - {left: 150, right: 150, ms: 90, fade: false}
    - {left: 0, right: 0, ms: 90, fade: false}
    - {left: 150, right: 150, ms: 90, fade: false}
    - {left: 0, right: 0, ms: 90, fade: false}
    - {left: 150, right: 150, ms: 90, fade: false}
    - {left: 0, right: 0, ms: 90, fade: false}
    - {left: 60, right: 60, ms: 0}
  busted:
    description: "busted \u2014 one hard snap, then sullen low"
    steps:
    - left: 255
      right: 255
      ms: 140
      fade: false
    - left: 0
      right: 0
      ms: 260
      fade: false
    - left: 40
      right: 40
      ms: 0
  aborted:
    description: "aborted \u2014 plain lights up, no drama"
    steps:
    - left: 120
      right: 120
      ms: 0
  result:
    description: "score on screen \u2014 enough to walk out by, no more"
    steps:
    - {left: 70, right: 70, ms: 0}
  fault:
    description: "something is wrong \u2014 slow throb so it is obvious from outside"
    loop: true
    steps:
    - left: 200
      right: 200
      ms: 700
    - left: 40
      right: 40
      ms: 700
