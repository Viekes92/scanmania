presets:
  blackout:
    channels: []
    description: all lasers off
  all_on:
    channels: '*'
    description: every relay on
  # Generated from the type field in beams.json (V-left, V-right vs
  # H-top-left, H-center, H-top-right) — regenerate if the wiring moves.
  # Used by the outcome shows: a clean run lights the verticals so the maze
  # reads as a corridor you could walk through, a bust lights the
  # horizontals so it reads as barred.
  vertical:
    channels:
    - 2
    - 4
    - 7
    - 9
    - 12
    - 14
    - 18
    - 20
    - 23
    - 25
    - 28
    - 30
    - 34
    - 36
    - 39
    - 41
    - 44
    - 46
    description: the 18 vertical segments — 'you got through'
  horizontal:
