# /etc/systemd/journald.conf.d/scanmania.conf
#
# Two months of an unattended tour with a kiosk unit that has restarted 773
# times fills a journal fast. More importantly, journald's default burst limit
# SILENTLY DROPS messages — so a flapping camera or a reconcile mismatch logging
# every 500 ms takes the post-mortem evidence with it, exactly when you need it.
#
# Install:  sudo cp -r deploy/journald.conf.d /etc/systemd/
#           sudo systemctl restart systemd-journald

[Journal]
Storage=persistent
SystemMaxUse=2G
SystemKeepFree=1G
SystemMaxFileSize=128M
MaxRetentionSec=90day

# Generous burst, so a real fault storm is recorded rather than truncated.
RateLimitIntervalSec=30s
RateLimitBurst=20000
