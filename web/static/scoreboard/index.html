<!DOCTYPE html>
<!--
  web/static/scoreboard/index.html — the organiser's scoreboard.

  Names and times, newest first, live. Read on a laptop or a phone by whoever
  is running the prize — not a screen in the container and not a screen the
  public sees.

  THIS PAGE DELIBERATELY IGNORES display.hide_times.

  That is its entire reason to exist. /display/in and /display/out are sealed
  for a grand-prize final so nobody in the queue knows what there is to beat;
  somebody still has to be able to read the times and award the thing. The
  GM console and the admin portal already show them, but the console is busy
  with a run and the admin portal needs a password and shows forty other
  things. This is the one view that is just the answer.

  Because of that, DO NOT put this on a screen anyone can see during a sealed
  final, and do not link it from the display pages. It is served
  unauthenticated, like /gm — see docs/grand-prize.md.

  Data comes from /api/admin/runs?scope=daily — every run, every outcome —
  NOT from the WebSocket's `leaderboard`, which is the display board and a
  different shape. The socket is used only as a change signal: when it fires,
  the page re-reads the day. scope=daily is resolved server-side from
  SCANMANIA_DAY_START_HOUR, because the 09:00 rollover is not something a
  browser should be recomputing.

  A FEED, not a ranking. Every run of the operating day in the order it
  happened, newest at the top — no positions, no sorting by time, no
  best-per-player. A new run appends to the top and nothing below it moves.

  That is deliberate, and it is the opposite of /display/out's leaderboard
  (one row per player, best clean run, ranked). A ranked view answers "who is
  winning"; this one answers "what has happened", which is what you want when
  you are watching the day go by and checking a time somebody is asking about.
  Reading the fastest off it is a job for your eyes, not the page.

  No build step, no CDN: a venue with no internet must still render this.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanMania — Scoreboard</title>
  <link rel="stylesheet" href="/static/shared/brand.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--sm-black);
      color: #fff;
      font-family: var(--sm-font);
      -webkit-font-smoothing: antialiased;
    }

    #wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ---- header --------------------------------------------------------- */
    header { margin-bottom: 22px; }
    .logo { width: min(60vw, 300px); display: block; }

    h1 {
      font-weight: 900;
      font-size: clamp(26px, 6vw, 40px);
      letter-spacing: 0.02em;
      margin-top: 14px;
    }
    .meta {
      margin-top: 6px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sm-dim);
    }

    /* A standing reminder of what this page is, because it is the one view
       that shows times while the public screens are sealed. Only rendered
       when the seal is actually on — the rest of the time it is noise. */
    #sealNote {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border: 2px solid var(--sm-red);
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.06em;
      line-height: 1.45;
      color: #fff;
    }
    #sealNote.on { display: block; }

    /* ---- the board ------------------------------------------------------ */
    #rows { margin-top: 24px; }

    .row {
      display: grid;
      grid-template-columns: 4.4em 1fr auto;
      align-items: baseline;
      gap: 14px;
      padding: 14px 4px;
      border-bottom: 1px solid #1b1f26;
      font-size: clamp(18px, 4.4vw, 26px);
      font-weight: 700;
    }
    /* Wall-clock start, so a run can be matched to "the one about ten past
       two". Browser-local, from the server's ISO timestamp — this is a label,
       never arithmetic (invariant 2: nothing computes a duration from wall
       clock). */
    .row .at { color: var(--sm-dim); font-weight: 700; font-variant-numeric: tabular-nums; }
    /* The newest run, which is the one somebody is usually asking about. */
    .row.latest .at { color: var(--sm-red); }
    .row .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .row .tm {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    /* Did-not-complete rows: present, readable, obviously not in the running.
       Dimmed rather than hidden — "why is my run not up there" is a question
       the operator has to be able to answer, and a missing row cannot. */
    .row.dnf { color: var(--sm-dim); font-weight: 600; }
    .row.dnf .tm { color: var(--sm-dim); }

    .badge {
      display: inline-block;
      margin-left: 0.6em;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.56em;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      vertical-align: middle;
      border: 1px solid currentColor;
    }
    .badge.busted  { color: var(--sm-red); }
    .badge.aborted { color: var(--sm-dim); }
    .badge.voided  { color: var(--sm-dim); text-decoration: line-through; }
    .badge.in_progress { color: var(--sm-blue); }

    .row.voided .nm { text-decoration: line-through; }

    .empty {
      padding: 40px 4px;
      color: var(--sm-dim);
      font-weight: 700;
      font-size: 18px;
    }

    footer {
      margin-top: 22px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sm-dim);
    }

    /* Small and low — this is for whoever is holding the laptop, not a
       spectator, so it never takes over the page. */
    #conn {
      display: none;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sm-red);
    }
    #conn.visible { display: block; }
  </style>
</head>
<body>

<div id="wrap">
  <header>
    <img class="logo" src="/static/shared/scanmania-design/sm-text-tp.png" alt="ScanMania">
    <h1>Scoreboard</h1>
    <div class="meta" id="meta">Loading…</div>
    <div id="sealNote">
      The public screens are sealed — they are showing no times at all.
      This page is the exception. Keep it off any screen the queue can see.
    </div>
  </header>

  <div id="rows"><div class="empty">Loading…</div></div>

  <footer id="count"></footer>
  <div id="conn">Reconnecting</div>
</div>

<script>
  "use strict";

  const rowsEl  = document.getElementById("rows");
  const metaEl  = document.getElementById("meta");
  const countEl = document.getElementById("count");
  const sealEl  = document.getElementById("sealNote");
  const connEl  = document.getElementById("conn");

  /* Same formatting as the displays, so a time read here matches a time read
     anywhere else to the centisecond. */
  function fmt(ms) {
    if (ms == null || isNaN(ms)) return "—";
    const t = Math.max(0, Math.floor(ms));
    const m = Math.floor(t / 60000);
    const s = Math.floor((t % 60000) / 1000);
    const c = Math.floor((t % 1000) / 10);
    return String(m).padStart(2, "0") + ":" +
           String(s).padStart(2, "0") + "." +
           String(c).padStart(2, "0");
  }

  let lastSig = null;

  /* Wall-clock HH:MM of the start, in the viewer's timezone. A LABEL — the
     run's duration is elapsed_ms from the server's monotonic clock and is
     never derived from this (invariant 2). */
  function at(iso) {
    if (!iso) return "--:--";
    const d = new Date(iso);
    if (isNaN(d)) return "--:--";
    return String(d.getHours()).padStart(2, "0") + ":" +
           String(d.getMinutes()).padStart(2, "0");
  }

  function row(r, latest) {
    // textContent throughout: a nickname is public input, typed at sign-in.
    const dnf = r.outcome !== "clean" || r.elapsed_ms == null;
    const el = document.createElement("div");
    el.className = "row" + (latest ? " latest" : "") + (dnf ? " dnf" : "")
                 + (r.outcome === "voided" ? " voided" : "");

    const when = document.createElement("span");
    when.className = "at";
    when.textContent = at(r.started_at);

    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = r.player_nickname || "—";
    if (dnf) {
      const b = document.createElement("span");
      b.className = "badge " + (r.outcome || "unknown");
      b.textContent = (r.outcome || "?").replace("_", " ");
      nm.append(b);
    }

    const tm = document.createElement("span");
    tm.className = "tm";
    tm.textContent = fmt(r.elapsed_ms);

    el.append(when, nm, tm);
    return el;
  }

  function render(runs) {
    // Newest first. The API already returns started_at DESC; sorting here too
    // so the order is a property of this page rather than a thing it inherits.
    const list = (runs || []).slice().sort(
      (a, b) => String(b.started_at).localeCompare(String(a.started_at)));

    const sig = JSON.stringify(list.map(
      r => [r.id, r.player_nickname, r.elapsed_ms, r.outcome]));
    if (sig === lastSig) return;
    lastSig = sig;

    rowsEl.textContent = "";
    if (!list.length) {
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "No runs yet today.";
      rowsEl.append(d);
      countEl.textContent = "";
      return;
    }

    list.forEach((r, i) => rowsEl.append(row(r, i === 0)));

    const clean = list.filter(r => r.outcome === "clean").length;
    countEl.textContent =
      `${list.length} run${list.length === 1 ? "" : "s"} today · ${clean} clean`;
  }

  /* Every run of the day, every outcome. scope=daily is resolved SERVER-side
     from SCANMANIA_DAY_START_HOUR — the 09:00 rollover is not something a
     browser should be recomputing. */
  async function load() {
    try {
      const r = await fetch("/api/admin/runs?scope=daily&limit=500");
      if (!r.ok) return;
      const d = await r.json();
      metaEl.textContent = "Today · newest first";
      render(d.runs || []);
    } catch (e) { /* leave whatever is on screen */ }
  }

  let wsSig = null;

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => connEl.classList.remove("visible");
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      /* The broadcast carries the display leaderboard, which is a different
         thing — one row per player, clean only. Use it purely as a signal
         that something changed, and re-read the full day from the API. */
      const sig = JSON.stringify(msg.leaderboard || []) + "|" + (msg.state || "");
      if (sig !== wsSig) { wsSig = sig; load(); }
      // Mirror the seal only to warn about it. The board above is rendered
      // either way — that is the point of this page.
      sealEl.classList.toggle("on", !!msg.hide_times);
    };
    ws.onclose = () => {
      connEl.classList.add("visible");
      setTimeout(connect, 2000);
    };
    ws.onerror = () => ws.close();
  }

  load();
  connect();
</script>

</body>
</html>
