      hold_ms: 90
    - preset: horizontal
      hold_ms: 90
    - preset: blackout
      hold_ms: 90
    - preset: horizontal
      hold_ms: 100
  clean:
    loop: false
    description: "clean run \u2014 verticals flash, then read as passable"
    steps:
    - preset: vertical
      hold_ms: 90
    - preset: blackout
      hold_ms: 90
    - preset: vertical
      hold_ms: 90
    - preset: blackout
      hold_ms: 90
    - preset: vertical
