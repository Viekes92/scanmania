presets:
  blackout:
    channels: []
    description: all lasers off
  all_on:
    channels: '*'
    description: every relay on
  arm_box:
    # BEAMS 12, 13, 14 — not channels 12/13/14. A beam id encodes
    # row+strip and maps to a per-board relay, so the global channel is
    # board_index*16 + relay_channel. Typing the ids in directly lit
    # beams 32/33/34: row 3, the far end of the container, instead of
    # row 1 at the plate.
    #
    #   beam 12 -> SM-NODE-1 ch2 (V-left) -> global 2
    #   beam 13 -> SM-NODE-1 ch3 (H-center) -> global 3
    #   beam 14 -> SM-NODE-1 ch4 (V-right) -> global 4
    channels:
    - 2
    - 3
    - 4
    description: "what the player sees from the plate — row 1, boxed in"
  vertical:
