<!DOCTYPE html>
<!--
  web/static/gm/index.html — Gamemaster console.

  The most important screen in the project. One page, no scrolling for anything
  urgent. Every action thumb-reachable on an iPad. Drives a full game session:
  COUNT IN, BUST, ABORT, VOID, FORCE RESET. Live beam strip. Health strip.
  Detection mode switcher. Assisted-mode confirm/veto overlay.

  Stopwatch is interpolated at 60 fps client-side using requestAnimationFrame;
  hard-corrected on each WebSocket message (server is authoritative).

  No external dependencies. Plain HTML/CSS/JS. Works in Chromium kiosk mode.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GM — SCANMANIA</title>
  <link rel="stylesheet" href="/static/shared/brand.css">
  <style>
    /* -----------------------------------------------------------------------
       Custom properties — neon red heist
    ----------------------------------------------------------------------- */
    :root {
      --bg:          #050507;
      --surface:     #080d18;
      --surface2:    #0d1525;
      --border:      #0d2a4a;
      /* Brand blue, sampled from the artwork like the displays use. It is
         2.8:1 on these surfaces, so it is CHROME ONLY — borders, glow, fills.
         Anything that renders as text uses --accent-text (5.6:1), a lighter
         tint of the same hue. Same split the admin console already documents:
         a console is read at arm's length in a lit container. */
      --accent:      #005AA9;
      --accent-glow: rgba(0, 90, 169, 0.6);
      --accent-text: #3D8FD6;
      --accent-dim:  #00305c;
      --text:        #e8f0fc;
      --muted:       #5a7899;

      /* action button colours */
      --green:       #00ff88;
      --green-dark:  #005533;
      /* Brand red for fills, borders and LEDs. As TEXT it is 4.4:1 — under
         AA — so red text uses --red-text (5.9:1). A bust indicator that is
         harder to read is not a trade worth making for a closer swatch. */
      --red:         #EC1C24;
      --red-text:    #FF4A50;
      --red-dark:    #6b0f13;
      --orange:      #ff8800;
      --orange-dark: #7a4200;
      --grey:        #555;
      --grey-dark:   #2a2a2a;

      /* beam state colours */
      --beam-ok:      #00ff88;
      --beam-broken:  #EC1C24;
      --beam-masked:  #444;

      /* health state colours */
      --health-ok:    #00ff88;
      --health-warn:  #ff8800;
      --health-err:   #EC1C24;

      --radius: 10px;
      --btn-h:  72px;          /* minimum 48 px, targeting 72 for iPad comfort */
      /* Two families on purpose. Proxima Nova (the display face) for chrome —
         headings, buttons, labels — so the console reads as the same product
         as the screens. Monospace stays on DATA: the stopwatch, coil grids,
         tables and logs, where digits have to hold their column. */
      --font: 'Courier New', Courier, monospace;
      --font-ui: 'Proxima Nova', 'Helvetica Neue', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;        /* no scrolling for anything urgent */
      background: var(--bg);
      background-image:
        linear-gradient(rgba(0, 90, 169,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 90, 169,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
      user-select: none;
    }

    /* -----------------------------------------------------------------------
       Top-level layout: top-bar, actions, detection, beams, health
       All sections visible without scrolling (designed for 768 px iPad height)
    ----------------------------------------------------------------------- */
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0;
      gap: 0;
    }

    /* -----------------------------------------------------------------------
       Section wrapper
    ----------------------------------------------------------------------- */
    .section {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    /* -----------------------------------------------------------------------
       Top bar — state, stopwatch, player name, detection badge
    ----------------------------------------------------------------------- */
    #topBar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border);
      background: var(--surface);
      box-shadow: inset 0 -1px 0 rgba(0, 90, 169,0.15);
      flex-shrink: 0;
    }

    #brandMark {
      height: 26px;
      width: auto;
      flex-shrink: 0;          /* a long nickname must not squeeze the logo */
      opacity: 0.92;
    }

    #stateLabel {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: var(--font-ui);
      color: var(--accent-text);
      text-shadow: 0 0 20px var(--accent-glow), 0 0 50px rgba(0, 90, 169,0.15);
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Large stopwatch — mono, always visible, no glow (readability first) */
    /* Monospace on purpose, not an oversight: the digits change ten times a
       second and a proportional face makes the whole clock jitter as they do.
       Same reason #playerName stays monospace — it is read back character by
       character against what the player typed at sign-in. */
    #stopwatch {
      font-family: 'Courier New', Courier, monospace;
      font-size: 48px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    #playerName {
      font-size: 18px;
      font-weight: 600;
      font-family: 'Courier New', Courier, monospace;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      flex-shrink: 0;
    }

    #playerName::before {
      content: "// ";
      color: var(--accent-dim);
    }

    #detectionBadge {
      display: inline-block;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      font-family: var(--font-ui);
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* AUTO = filled red pill */
    #detectionBadge.mode-auto {
      background: var(--accent);
      color: #000;
      border-color: var(--accent-text);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* ASSISTED = amber border only */
    #detectionBadge.mode-assisted {
      background: transparent;
      color: var(--orange);
      border-color: var(--orange);
    }

    /* MANUAL = muted */
    #detectionBadge.mode-manual {
      background: transparent;
      color: var(--muted);
      border-color: var(--grey);
    }

    /* -----------------------------------------------------------------------
       Banner alerts — stacked above the actions
    ----------------------------------------------------------------------- */
    #banners {
      flex-shrink: 0;
    }

    .banner {
      display: none;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
    }

    .banner.visible { display: block; }

    .banner-red {
      background: rgba(236, 28, 36, 0.12);
      color: var(--red-text);
      border-bottom: 1px solid var(--red);
      animation: pulse-banner 1.4s ease-in-out infinite;
    }

    .banner-amber {
      background: rgba(255, 136, 0, 0.10);
      color: var(--orange);
      border-bottom: 1px solid var(--orange);
    }

    @keyframes pulse-banner {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }

    /* -----------------------------------------------------------------------
       Primary action buttons row
    ----------------------------------------------------------------------- */
    /* Fixed slots. grid, not flex: a flex row with display:none reflows the
       survivors, so a button's position depended on which other buttons were
       applicable. Each control now owns a column for the whole session. */
    #actions {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .action-btn {
      height: var(--btn-h);
      font-size: 18px;
      font-weight: 900;
      font-family: var(--font-ui);
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--surface2);
      border-radius: var(--radius);
      cursor: pointer;
      transition: filter 0.1s, transform 0.08s, background 0.08s, color 0.08s;
      touch-action: manipulation;
    }

    .action-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .action-btn:disabled {
      opacity: 0.28;
      cursor: not-allowed;
      transform: none;
      box-shadow: none !important;
    }

    /* Individual action colours — outlined style */
    #btnCountIn {
      border: 2px solid var(--green);
      color: var(--green);
    }
    #btnCountIn:active:not(:disabled) {
      background: var(--green);
      color: #000;
    }

    #btnBust {
      border: 2px solid var(--red);
      color: var(--red-text);
      box-shadow: 0 0 10px rgba(236, 28, 36,0.25), inset 0 0 6px rgba(236, 28, 36,0.05);
    }
    #btnBust:active:not(:disabled) {
      background: var(--red);
      color: #000;
    }

    #btnAbort {
      border: 2px solid var(--orange);
      color: var(--orange);
    }
    #btnAbort:active:not(:disabled) {
      background: var(--orange);
      color: #000;
    }

    #btnVoid {
      border: 2px solid #555;
      color: #888;
    }
    #btnVoid:active:not(:disabled) {
      background: #555;
      color: #fff;
    }

    #btnCancel {
      border: 1px solid var(--grey);
      color: var(--muted);
      background: transparent;
      font-size: 16px;
    }
    #btnCancel:active:not(:disabled) {
      background: var(--grey-dark);
      color: var(--text);
    }

    /* Recovery control. Small, cornered, and far from the game buttons — it
       used to sit in the action row at the same 72px height as BUST, taking a
       third to half the bar in every state. Tap-to-confirm is still applied in
       JS, so a single stray touch cannot destroy a session. */
    #btnForceReset {
      position: fixed;
      bottom: 12px;
      right: 14px;
      z-index: 60;
      width: auto;
      height: 44px;              /* still clears the 44px touch minimum */
      padding: 0 18px;
      border: 1px solid var(--accent-dim);
      color: var(--muted);
      background: rgba(5, 5, 7, 0.92);
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }
    #btnForceReset:active:not(:disabled) {
      background: var(--accent-dim);
      color: var(--text);
    }

    /* -----------------------------------------------------------------------
       Detection mode switcher — segmented control
    ----------------------------------------------------------------------- */
    #detectionSection {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-dim);
      margin-bottom: 8px;
    }

    #detectionToggle {
      display: flex;
      gap: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .seg-btn {
      flex: 1;
      height: 48px;
      font-size: 15px;
      font-weight: 800;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, box-shadow 0.12s;
      touch-action: manipulation;
    }

    .seg-btn.active {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .seg-btn:not(.active):active {
      background: var(--surface);
    }

    #detectionToggle.locked {
      pointer-events: none;
      opacity: 0.3;
    }

    /* -----------------------------------------------------------------------
       Vision strip — one card per camera

       This was 45 pills, one per relay channel. Detection now watches ~175
       individual dots, and 175 pills is not something anyone reads on an iPad
       mid-run. A card per camera answers the live question: is vision seeing
       what it should. Masking an individual dot lives on /admin/beams, where
       you can see it on the frame.
    ----------------------------------------------------------------------- */
    #beamSection {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #beamStrip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: stretch;
    }

    .cam-card {
      flex: 1 1 130px;
      min-width: 120px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      font-family: monospace;
    }
    .cam-card .cam-id {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .cam-card .cam-n {
      font-size: 22px;
      font-weight: 700;
      color: var(--beam-ok);
      line-height: 1.2;
    }
    .cam-card .cam-sub { font-size: 12px; color: var(--muted); }
    .cam-card.dark  { border-color: var(--beam-broken);
                      box-shadow: 0 0 8px rgba(236, 28, 36,0.35); }
    .cam-card.dark  .cam-n { color: var(--beam-broken);
                             animation: flash-red 0.5s infinite; }
    .cam-card.blind { border-color: var(--beam-masked); }
    .cam-card.blind .cam-n { color: var(--beam-masked); }

    #beamSummary {
      font-family: monospace;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    #beamSummary .bad { color: var(--beam-broken); }

    @keyframes flash-red {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* -----------------------------------------------------------------------
       Health strip — relay boards, Pico, camera, hazer
    ----------------------------------------------------------------------- */
    #healthSection {
      padding: 10px 14px;
      flex-shrink: 0;
    }

    #healthStrip {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .health-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      font-family: 'Courier New', Courier, monospace;
      color: var(--text);
      min-height: 48px;
    }

    .health-led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .health-led.ok   { background: var(--health-ok); }
    .health-led.warn { background: var(--health-warn); animation: pulse-warn 1.5s infinite; }
    .health-led.err  { background: var(--health-err); animation: pulse-err 0.8s infinite; }
    /* Deliberately off, not faulty. No pulse, no red — the row's other LEDs
       use red for failures and this would read as one. */
    .health-led.off  { background: var(--surface2); border: 2px solid var(--muted); }

    @keyframes pulse-warn {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    @keyframes pulse-err {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--health-err); }
      50%       { opacity: 0.2; box-shadow: none; }
    }

    /* -----------------------------------------------------------------------
       Scrollable lower section — last 10 runs
    ----------------------------------------------------------------------- */
    #lowerSection {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }

    .lower-label {
      font-size: 11px;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-dim);
      margin-bottom: 10px;
    }

    .lower-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    #btnExportDay {
      background: #12202f;
      color: #8fb7e0;
      border: 1px solid #2f5f9a;
      border-radius: 6px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      min-height: 40px;
      cursor: pointer;
    }
    #btnExportDay:active { background: #1d3a5e; }

    #recentRuns {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .run-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Courier New', Courier, monospace;
      transition: border-color 0.12s;
    }

    .run-row:hover {
      border-color: var(--accent-dim);
    }

    .run-outcome {
      font-weight: 800;
      font-size: 11px;
      font-family: 'Courier New', Courier, monospace;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .run-outcome.clean   { background: rgba(0,255,136,0.12); color: var(--green); border: 1px solid #005533; }
    .run-outcome.busted  { background: rgba(236, 28, 36,0.12);  color: var(--red-text);   border: 1px solid #660015; }
    .run-outcome.aborted { background: rgba(255,136,0,0.12); color: var(--orange); border: 1px solid #7a4200; }
    .run-outcome.voided  { background: rgba(85,85,85,0.12);  color: var(--grey);  border: 1px solid #333; }

    .run-name  { flex: 1; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .run-time  { font-family: 'Courier New', Courier, monospace; color: var(--muted); white-space: nowrap; }

    /* -----------------------------------------------------------------------
       Assisted mode confirm/veto overlay — full screen, urgent
    ----------------------------------------------------------------------- */
    #assistedOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 100;
    }

    #assistedOverlay.visible { display: flex; }

    #assistedTitle {
      font-size: 48px;
      font-weight: 900;
      font-family: 'Courier New', Courier, monospace;
      color: var(--accent-text);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 0 30px var(--accent-glow), 0 0 60px rgba(0, 90, 169,0.2);
    }

    #assistedBeam {
      font-size: 24px;
      font-family: 'Courier New', Courier, monospace;
      color: var(--muted);
      letter-spacing: 2px;
    }

    /* Thumbnail of the triggering ROI */
    #assistedThumb {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--red);
      box-shadow: 0 0 20px rgba(236, 28, 36,0.5);
      background: #060d1a;
      display: block;
    }

    .assisted-btns {
      display: flex;
      gap: 24px;
      width: 100%;
      max-width: 480px;
      padding: 0 24px;
    }

    .assisted-btns button {
      height: 100px;
      font-size: 28px;
      font-weight: 900;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: var(--radius);
      cursor: pointer;
      touch-action: manipulation;
      transition: filter 0.1s, transform 0.08s;
    }

    .assisted-btns button:active {
      filter: brightness(0.8);
      transform: scale(0.97);
    }

    /* BUST — filled red, narrower (40%) */
    #btnConfirm {
      flex: 4 1 0;
      background: var(--red);
      color: #000;
      border: 2px solid var(--red);
      box-shadow: 0 0 20px rgba(236, 28, 36,0.4);
    }

    /* CLEAR — filled green, wider (60%) */
    #btnVeto {
      flex: 6 1 0;
      background: var(--green);
      color: #000;
      border: 2px solid var(--green);
      box-shadow: 0 0 20px rgba(0,255,136,0.3);
    }

    /* -----------------------------------------------------------------------
       WS disconnect banner
    ----------------------------------------------------------------------- */
    #wsDisconnectBanner {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 900;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      background: var(--red);
      color: #000;
      flex-shrink: 0;
      z-index: 200;
      animation: pulse-banner 1.4s ease-in-out infinite;
    }

    #wsDisconnectBanner.visible { display: block; }

    /* -----------------------------------------------------------------------
       WebSocket status
    ----------------------------------------------------------------------- */
    #wsStatus {
      position: fixed;
      bottom: 8px;
      right: 12px;
      font-size: 11px;
      font-family: 'Courier New', Courier, monospace;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ws-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
    }

    .ws-dot.ok  { background: var(--health-ok); }
    .ws-dot.err { background: var(--health-err); }

    /* Sign-in form inputs */
    .signin-input {
      height: 56px;
      font-size: 18px;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 1px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0 16px;
      outline: none;
      caret-color: var(--green);
      width: 100%;
    }

    .signin-input:focus {
      border-color: var(--accent-text);
    }

    .gender-btn.selected {
      border-color: var(--green) !important;
      color: var(--green) !important;
      background: rgba(0,255,136,0.08) !important;
    }
  </style>
</head>
<body>

  <!-- -----------------------------------------------------------------------
       TOP BAR — state · stopwatch · player · detection badge
  ----------------------------------------------------------------------- -->
  <div id="topBar">
    <img id="brandMark" src="/static/shared/scanmania-design/sm-text-tp.png"
         alt="ScanMania">
    <div id="stateLabel">ATTRACT</div>
    <div id="stopwatch">00:00.000</div>
    <div id="playerName">—</div>
    <div id="detectionBadge" class="mode-auto">AUTO</div>
  </div>

  <!-- -----------------------------------------------------------------------
       BANNER ALERTS
  ----------------------------------------------------------------------- -->
  <!-- -----------------------------------------------------------------------
       PLAYER SIGN-IN PANEL (toggled by NEW PLAYER button, visible in ATTRACT)
  ----------------------------------------------------------------------- -->
  <div id="signinPanel" style="
    display:none;
    position:fixed; inset:0; z-index:90;
    background:rgba(0,0,0,0.92);
    flex-direction:column;

  <!-- -----------------------------------------------------------------------
       ASSISTED MODE OVERLAY — full-screen confirm/veto prompt
  ----------------------------------------------------------------------- -->
  <div id="assistedOverlay">
    <div id="assistedTitle">BEAM BREAK DETECTED</div>

    <img id="assistedThumb" src="" alt="Evidence thumbnail" style="display:none;">
    <div class="assisted-btns">

  <!-- WebSocket status -->
  <div id="wsStatus">
    <div class="ws-dot" id="wsDot"></div>
    <span id="wsLabel">connecting…</span>
  </div>

  <script>
    /* -----------------------------------------------------------------------
       Gamemaster console JS

       WebSocket message shape (server broadcasts at ~10 Hz):
       {
         state: "RUN_SEG_1",
         detection_mode: "auto",
         elapsed_ms: 4321,
         started_at_mono: <float, seconds>,
         server_mono_now: <float, seconds>,
         countdown_step: null | 0-7,
         countdown_total: null | int,
         player_nickname: "Joenne",
         pending_break: null | "cam_3:d17",   // dot id, not a channel
         outcome: null | "clean" | "busted",
         beams_masked: [ "b03", "b07", … ],   // array of masked beam IDs
         boards: { "board_0": { status: "OK"|"ERR" }, … },
         inputs: { connected: bool },
       }
    ----------------------------------------------------------------------- */

    "use strict";

    /* ---- State constants ---- */
    const RUN_STATES      = new Set(["RUN_SEG_1", "RUN_SEG_2", "RUN_SEG_3"]);
    const ACTIVE_STATES   = new Set(["RUN_SEG_1", "RUN_SEG_2", "RUN_SEG_3", "COUNTDOWN"]);
    const POST_RUN_STATES = new Set(["FINISHED", "BUSTED", "ABORTED", "RESULT"]);

    /* ---- DOM refs ---- */
    const stateLabel       = document.getElementById("stateLabel");
    const stopwatchEl      = document.getElementById("stopwatch");
    const playerNameEl     = document.getElementById("playerName");
    const detectionBadge   = document.getElementById("detectionBadge");
    const bannerManual     = document.getElementById("bannerManual");
    const bannerMasked     = document.getElementById("bannerMasked");
    const btnCountIn       = document.getElementById("btnCountIn");
    const btnBust          = document.getElementById("btnBust");
    const btnAbort         = document.getElementById("btnAbort");
    const btnCancel        = document.getElementById("btnCancel");
    const btnVoid          = document.getElementById("btnVoid");
    const btnForceReset    = document.getElementById("btnForceReset");
    const gmFeedback       = document.getElementById("gmFeedback");
    const detectionToggle  = document.getElementById("detectionToggle");
    const beamStrip        = document.getElementById("beamStrip");
    const recentRuns       = document.getElementById("recentRuns");
    const assistedOverlay  = document.getElementById("assistedOverlay");
    const assistedBeam     = document.getElementById("assistedBeam");
    const assistedThumb    = document.getElementById("assistedThumb");
    const btnConfirm       = document.getElementById("btnConfirm");
    const btnVeto          = document.getElementById("btnVeto");
    const wsDot            = document.getElementById("wsDot");
    const wsLabel          = document.getElementById("wsLabel");
    const hBoardsLed       = document.getElementById("hBoardsLed");
    const hOptaLed         = document.getElementById("hOptaLed");
    const hDmxLed          = document.getElementById("hDmxLed");
    const hCameraLed       = document.getElementById("hCameraLed");

    /* -----------------------------------------------------------------------
       Stopwatch interpolation
       Server sends: elapsed_ms (at the time of the message) +
                     server_mono_now_ns (server monotonic nanoseconds, not used in calculation)
       We record arrival time (performance.now() / 1000) and interpolate.
    ----------------------------------------------------------------------- */
    let swElapsedAtMsg  = 0;      // elapsed_ms from the last WS message
    let swServerMono    = 0;      // server monotonic seconds at that message
    let swClientAtMsg   = 0;      // performance.now() seconds at message arrival
    let swRunning       = false;  // whether to interpolate
    let rafId           = null;

    function formatTime(ms) {
      /* Format elapsed milliseconds as MM:SS.mmm */
      const totalMs = Math.max(0, Math.floor(ms));
      const minutes = Math.floor(totalMs / 60000);
      const seconds = Math.floor((totalMs % 60000) / 1000);
      const millis  = totalMs % 1000;
      return `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}.${String(millis).padStart(3,"0")}`;
    }

    function interpolatedElapsed() {
      if (!swRunning) return swElapsedAtMsg;
      const nowClient = performance.now() / 1000;
      const drift = nowClient - swClientAtMsg;
      return swElapsedAtMsg + drift * 1000;
    }

    function tickStopwatch() {
      stopwatchEl.textContent = formatTime(interpolatedElapsed());
      rafId = requestAnimationFrame(tickStopwatch);
    }

    function startInterpolation() {
      if (!rafId) rafId = requestAnimationFrame(tickStopwatch);
    }

    function stopInterpolation() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    /* -----------------------------------------------------------------------
       Apply a full server state update to the UI
    ----------------------------------------------------------------------- */
    let currentState     = "ATTRACT";
    let currentDetection = "auto";

    function applyState(msg) {
      const state     = msg.state      || "ATTRACT";
      const detection = msg.detection_mode || "auto";
      const prevState  = currentState;
      currentState     = state;
      currentDetection = detection;

      /* --- Top bar --- */
      const STATE_LABELS = {
        "REGISTERED": "PLAYER READY",
        "ARM":        "ON PLATE",
        "COUNTDOWN":  "COUNTING IN",
        "FINISHED":   "CLEAN!",
        "BUSTED":     "BUSTED",
        "ABORTED":    "ABORTED",
        "RESULT":     "RESULT",
        "FAULT":      "FAULT",
        "MASTER":     "MASTER MODE — check container, then FORCE RESET",
        "RUN_SEG_1":  "RUN — SEG 1",
        "RUN_SEG_2":  "RUN — SEG 2",
        "RUN_SEG_3":  "RUN — SEG 3",
        "SELF_TEST":  "SELF TEST",
        "BOOT":       "BOOTING",
        "RESET":      "RESETTING",
      };
      let stateText = STATE_LABELS[state] || state;
      // Issue 84: show countdown step next to state label
      if (state === "COUNTDOWN" && msg.countdown_step != null && msg.countdown_total != null) {
        stateText += ` ${msg.countdown_step}/${msg.countdown_total}`;
      }
      stateLabel.textContent     = stateText;
      playerNameEl.textContent   = msg.player_nickname || "—";
      detectionBadge.textContent = detection.toUpperCase();
      detectionBadge.className   = `mode-${detection}`;

      /* --- Stopwatch --- */
      swElapsedAtMsg = msg.elapsed_ms || 0;
      swServerMono   = msg.server_mono_now || 0;
      swClientAtMsg  = performance.now() / 1000;
      swRunning      = RUN_STATES.has(state);
      if (swRunning) startInterpolation();
      else           stopInterpolation();
      stopwatchEl.textContent = formatTime(swElapsedAtMsg);

      /* --- Button enable/disable + visibility rules (from plan §7.2) --- */
      // Enabled states
      const countInEnabled    = (state === "ARM");
      const bustEnabled       = RUN_STATES.has(state);
      const abortEnabled      = (RUN_STATES.has(state) || state === "COUNTDOWN");
      const cancelEnabled     = (state === "COUNTDOWN" || state === "REGISTERED");
      const voidEnabled       = POST_RUN_STATES.has(state);

      // Apply disabled attribute
      btnCountIn.disabled    = !countInEnabled;
      btnBust.disabled       = !bustEnabled;
      btnAbort.disabled      = !abortEnabled;
      btnCancel.disabled     = !cancelEnabled;
      btnVoid.disabled       = !voidEnabled;
      btnForceReset.disabled = false;  // always enabled

      // Nothing is hidden. Every button holds its column and dims when it does
      // not apply, so no control ever moves under the operator's thumb. The
      // `disabled` attribute above is the only thing that changes.

      // Reset tap-to-confirm buttons when the state ACTUALLY changes.
      //
      // This used to run on every frame. applyState() is called per broadcast,
      // ~10 Hz, so a pending "TAP AGAIN" was cleared within 100 ms and the
      // second tap only ever restarted the cycle. BUST, VOID and FORCE RESET
      // were all unreachable from the console — the request never left the
      // browser. Guarding on prevState is the whole fix.
      if (state !== prevState) {
        [btnBust, btnVoid, btnForceReset].forEach(btn => {
          if (btn._tapReset) btn._tapReset();
        });
      }

      // Issue 17: close void overlay when leaving POST_RUN_STATES
      if (!POST_RUN_STATES.has(state)) closeVoidOverlay();

      /* --- Stopwatch color by state --- */
      if (RUN_STATES.has(state)) {
        stopwatchEl.style.color = "#ffffff";
      } else if (state === "BUSTED") {
        stopwatchEl.style.color = "var(--red)";
      } else if (state === "FINISHED") {
        stopwatchEl.style.color = "var(--green)";
      } else if (state === "RESULT") {
        // Preserve color from outcome: green if clean, red if busted
        if (msg.outcome === "clean") {
          stopwatchEl.style.color = "var(--green)";
        } else if (msg.outcome === "busted") {
          stopwatchEl.style.color = "var(--red)";
        }
        // else leave color unchanged from previous state
      } else {
        stopwatchEl.style.color = "var(--muted)";
      }

      /* --- Detection toggle locked during RUN / COUNTDOWN --- */
      const detectionLocked = RUN_STATES.has(state) || state === "COUNTDOWN";
      detectionToggle.classList.toggle("locked", detectionLocked);

      /* --- Detection mode segmented control --- */
      document.querySelectorAll(".seg-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === detection);
      });

      /* --- Banners --- */
      // Issue 5: derive health from WS data — no msg.health object
      // FAULT state: show bannerManual as red "SYSTEM FAULT" alert
      // manual degraded: detection is manual (not auto/assisted) during an active run
      const detectionDegraded = (detection === "manual") &&
        (RUN_STATES.has(state) || state === "COUNTDOWN");
      if (state === "FAULT") {
        bannerManual.classList.add("visible");
        bannerManual.textContent = "SYSTEM FAULT — TAP FORCE RESET";
        bannerManual.classList.remove("banner-amber");
        bannerManual.classList.add("banner-red");
      } else {
        bannerManual.textContent = "⚠ DETECTION OFFLINE — CALL BUSTS MANUALLY";
        bannerManual.classList.remove("banner-amber");
        bannerManual.classList.add("banner-red");
        bannerManual.classList.toggle("visible", detectionDegraded);
      }
      // Cloud sync banner: not currently in WS data, leave hidden
      // Masked beams banner: derived from beams_masked array
      const maskedBeams = Array.isArray(msg.beams_masked) ? msg.beams_masked : [];
      const maskedCount = maskedBeams.length;
      bannerMasked.classList.toggle("visible", maskedCount > 0);
      if (maskedCount > 0) {
        bannerMasked.textContent =
          `${maskedCount} beam${maskedCount > 1 ? "s" : ""} masked`;
      }

      /* --- ATTRACT hint --- */
      let attractHint = document.getElementById("attractHint");
      if (state === "ATTRACT") {
        if (!attractHint) {
          attractHint = document.createElement("div");
          attractHint.id = "attractHint";
          attractHint.style.cssText = "font-size:13px; color:var(--muted); font-family:'Courier New',Courier,monospace; text-align:center; padding:4px 14px; flex-shrink:0;";
          bannerMasked.parentNode.insertAdjacentElement("afterend", attractHint);
        }
        attractHint.textContent = "Tap NEW PLAYER to begin";
        attractHint.style.display = "block";
      } else if (attractHint) {
        attractHint.style.display = "none";
      }

      /* --- Health strip --- */
      // Issue 5: derive health from WS data — no msg.health object
      // Relay boards: green if all OK, red if any failed
      if (msg.boards && typeof msg.boards === "object") {
        const boardVals = Object.values(msg.boards);
        const allOk = boardVals.length > 0 && boardVals.every(b => b.status === "OK");
        setLed(hBoardsLed, allOk ? "ok" : (boardVals.length ? "err" : "warn"));
      }
      // Opta inputs: connected flag
      if (msg.inputs) {
        setLed(hOptaLed, msg.inputs.connected ? "ok" : "err");
      }
      // DMX node LED is driven by refreshHazer()'s poll, not the WS message.
      // Issue 51: camera LED left as "warn" (unknown) — do NOT hardcode "ok"

      /* --- Vision strip --- */
      renderVision(msg.vision, maskedCount);

      /* --- Assisted overlay --- */
      if (msg.pending_break) {
        // A dot id is "cam_3:d17" — the camera that saw it, then which dot.
        // Split it so the operator reads the camera first: that is what tells
        // them where in the container to look.
        const parts = String(msg.pending_break).split(":");
        assistedBeam.textContent = parts.length === 2
          ? `${parts[0]} · dot ${parts[1]}` : msg.pending_break;
        /* Only load thumbnail when we have a valid run_id */
        if (msg.run_id) {
          assistedThumb.src = `/api/evidence/${encodeURIComponent(msg.run_id)}`
                            + `/${encodeURIComponent(msg.pending_break)}`;
          assistedThumb.style.display = "block";
        } else {
          assistedThumb.removeAttribute("src");
          assistedThumb.style.display = "none";
        }
        // Issue 85: vibrate when overlay opens (if not already visible)
        if (!assistedOverlay.classList.contains("visible")) {
          if (navigator.vibrate) navigator.vibrate(200);
        }
        assistedOverlay.classList.add("visible");
      } else {
        assistedOverlay.classList.remove("visible");
      }

      /* --- Sign-in form visibility --- */
      updateSigninVisibility(state);

      /* --- Issue 6: refresh recent runs when transitioning to ATTRACT --- */
      if (state === "ATTRACT" && prevState !== "ATTRACT") {
        fetchRecentRuns();
      }
    }

    function setLed(el, status) {
      el.className = "health-led " + (status === "ok" ? "ok" : status === "warn" ? "warn" : "err");
    }

    /* -----------------------------------------------------------------------
       Vision strip rendering

       Fed straight from the WS state's `vision` block: {maze, total, cameras:
       {cam_id: {watched, dark, masked}}}. No fetch, no cached id list — the
       server already knows which dots are being watched for the lit maze, and
       that set changes every time the shape changes.
    ----------------------------------------------------------------------- */
    const beamSummary = document.getElementById("beamSummary");
    const camCards = new Map();

    function renderVision(vision, maskedCount) {
      if (!vision) {
        beamSummary.textContent = "vision offline";
        beamStrip.innerHTML = "";
        camCards.clear();
        return;
      }

      const cams = vision.cameras || {};
      const ids = Object.keys(cams).sort();
      const totalDark = ids.reduce((n, c) => n + (cams[c].dark || 0), 0);

      if (!vision.total) {
        // No capture for this shape. Nothing is watched, on purpose — without a
        // baseline every reading is a guess, and a guess ends someone's run.
        beamSummary.innerHTML = vision.maze
          ? `<span class="bad">${escHtml(vision.maze)} is not calibrated — nothing watched</span>`
          : "no maze lit";
      } else {
        let txt = `${vision.total} dots watched`;
        if (totalDark)    txt += ` · <span class="bad">${totalDark} dark</span>`;
        if (maskedCount)  txt += ` · ${maskedCount} masked`;
        if (vision.maze)  txt += ` · ${escHtml(vision.maze)}`;
        beamSummary.innerHTML = txt;
      }

      const seen = new Set();
      ids.forEach(cid => {
        seen.add(cid);
        let card = camCards.get(cid);
        if (!card) {
          card = document.createElement("div");
          card.className = "cam-card";
          card.innerHTML = `<div class="cam-id">${escHtml(cid)}</div>`
                         + `<div class="cam-n"></div>`
                         + `<div class="cam-sub"></div>`;
          beamStrip.appendChild(card);
          camCards.set(cid, card);
        }
        const c = cams[cid];
        const dark = c.dark || 0;
        card.className = "cam-card" + (dark ? " dark" : (c.watched ? "" : " blind"));
        card.querySelector(".cam-n").textContent = c.watched;
        card.querySelector(".cam-sub").textContent =
          !c.watched ? "no dots"
          : dark     ? `${dark} dark`
          : c.masked ? `${c.masked} masked`
          : "all lit";
      });

      for (const [cid, card] of camCards) {
        if (!seen.has(cid)) { card.remove(); camCards.delete(cid); }
      }
    }

    /* -----------------------------------------------------------------------
       Recent runs rendering
       Issue 6: fetch from /api/admin/runs?limit=10 on load and after ATTRACT
    ----------------------------------------------------------------------- */
    function renderRecentRuns(runs) {
      if (!runs.length) {
        recentRuns.innerHTML = '<span style="color: var(--muted); font-size:13px; font-family:monospace;">No runs yet.</span>';
        return;
      }
      recentRuns.innerHTML = runs.map(r => `
        <div class="run-row">
          <span class="run-outcome ${r.outcome}">${r.outcome}</span>
          <span class="run-name">${escHtml(r.player_nickname || "—")}</span>
          <span class="run-time">${r.elapsed_ms != null ? formatTime(r.elapsed_ms) : "—"}</span>
        </div>`).join("");
    }

    async function fetchRecentRuns() {
      try {
        const resp = await fetch("/api/admin/runs?limit=10");
        if (resp.ok) {
          const data = await resp.json();
          renderRecentRuns(Array.isArray(data) ? data : (data.runs || []));
        }
      } catch (err) {
        console.warn("fetchRecentRuns failed:", err);
      }
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    /* -----------------------------------------------------------------------
       API calls — all action buttons POST to /api/gm/*
    ----------------------------------------------------------------------- */

    let gmFeedbackTimer = null;

    function showGmFeedback(msg) {
      gmFeedback.textContent = msg;
      gmFeedback.style.display = "block";
      gmFeedback.style.opacity = "1";
      if (gmFeedbackTimer) clearTimeout(gmFeedbackTimer);
      gmFeedbackTimer = setTimeout(() => {
        gmFeedback.style.opacity = "0";
        setTimeout(() => { gmFeedback.style.display = "none"; }, 300);
      }, 3000);
    }

    async function gmPost(endpoint, body = {}) {
      try {
        const resp = await fetch(`/api/gm/${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const d = await resp.json().catch(() => ({}));
          const msg = d.detail || d.error || `Error ${resp.status}`;
          console.warn(`GM action ${endpoint} failed:`, d);
          showGmFeedback(`${endpoint.toUpperCase()} FAILED: ${msg}`);
        }
      } catch (err) {
        console.error(`GM action ${endpoint} network error:`, err);
        showGmFeedback(`NETWORK ERROR — ${endpoint.toUpperCase()}`);
      }
    }

    /* --- Player sign-in panel --- */
    const signinPanel    = document.getElementById("signinPanel");
    const signinForm     = document.getElementById("signinForm");
    const sfName         = document.getElementById("sfName");
    const sfSurname      = document.getElementById("sfSurname");
    const sfEmail        = document.getElementById("sfEmail");
    const sfDob          = document.getElementById("sfDob");
    const btnNewPlayer   = document.getElementById("btnNewPlayer");
    const btnSigninCancel = document.getElementById("btnSigninCancel");
    let selectedGender   = "";

    // Gender toggle buttons
    document.querySelectorAll(".gender-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedGender = btn.dataset.g;
        document.querySelectorAll(".gender-btn").forEach(b =>
          b.classList.toggle("selected", b.dataset.g === selectedGender));
      });
    });

    function openSigninPanel() {
      signinPanel.style.display = "flex";
      showSigninError("");   // don't carry a stale failure into a new sign-in
      sfName.value = "";
      sfSurname.value = "";
      sfEmail.value = "";
      sfDob.value = "";
      selectedGender = "";
      document.querySelectorAll(".gender-btn").forEach(b => b.classList.remove("selected"));
      sfName.focus();
    }

    function closeSigninPanel() {
      signinPanel.style.display = "none";
    }

    btnNewPlayer.addEventListener("click", openSigninPanel);
    btnSigninCancel.addEventListener("click", closeSigninPanel);

    signinForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const first_name = sfName.value.trim();
      const surname = sfSurname.value.trim();
      const email = sfEmail.value.trim();
      // Server requires first_name only — see routes_signin.py::SignInBody.
      if (!first_name) return;
      try {
        const resp = await fetch("/api/signin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            first_name,
            surname,
            email,
            dob: sfDob.value || "",
            gender: selectedGender,
          }),
        });
        if (resp.ok) {
          showSigninError("");
          closeSigninPanel();
        } else {
          showSigninError(resp.status === 422
            ? "First name is required"
            : `Sign-in failed (${resp.status}) — try again`);
        }
      } catch (err) {
        console.error("Sign-in error:", err);
        showSigninError("No connection to the server — check the link");
      }
    });

    function showSigninError(msg) {
      const el = document.getElementById("sfError");
      el.textContent = msg || "";
      el.style.display = msg ? "block" : "none";
    }

    function updateSigninVisibility(state) {
      // Dim rather than hide, for the same reason as the rest of the row.
      btnNewPlayer.disabled = (state !== "ATTRACT");
      // Auto-close the panel if we leave ATTRACT (e.g. force reset)
      if (state !== "ATTRACT") closeSigninPanel();
    }

    /* -----------------------------------------------------------------------
       Tap-to-confirm helper
       Usage: makeTapConfirm(btn, label, onConfirm)
         - First tap: changes btn text to "TAP AGAIN", starts 3s timeout.
         - Second tap within 3s: calls onConfirm(), resets text.
         - Timeout: resets text without executing.
       Do NOT wrap: COUNT IN, ABORT, CANCEL (time-sensitive).
    ----------------------------------------------------------------------- */
    function makeTapConfirm(btn, originalLabel, onConfirm) {
      let pending = false;
      let timer   = null;

      function reset() {
        pending = false;
        if (timer) { clearTimeout(timer); timer = null; }
        btn.textContent = originalLabel;
      }

      btn.addEventListener("click", () => {
        if (!pending) {
          pending = true;
          btn.textContent = "TAP AGAIN";
          timer = setTimeout(reset, 3000);
        } else {
          reset();
          onConfirm();
        }
      });

      // Expose reset so applyState can clear pending state on state change
      btn._tapReset = reset;
    }

    /* -----------------------------------------------------------------------
       VOID reason overlay
    ----------------------------------------------------------------------- */
    const voidOverlay      = document.getElementById("voidOverlay");
    const btnVoidCancel    = document.getElementById("btnVoidCancel");

    function openVoidOverlay() {
      voidOverlay.style.display = "flex";
    }

    function closeVoidOverlay() {
      voidOverlay.style.display = "none";
    }

    btnVoidCancel.addEventListener("click", closeVoidOverlay);

    document.querySelectorAll(".void-reason-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const reason = btn.dataset.reason;
        closeVoidOverlay();
        // Reset the VOID button tap-confirm state
        if (btnVoid._tapReset) btnVoid._tapReset();
        gmPost("void", { reason });
      });
    });

    /* -----------------------------------------------------------------------
       Action button wiring
    ----------------------------------------------------------------------- */
    btnCountIn.addEventListener("click", () => gmPost("count-in"));
    btnAbort.addEventListener("click",   () => gmPost("abort"));
    btnCancel.addEventListener("click",  () => gmPost("cancel"));

    // BUST — tap-to-confirm
    makeTapConfirm(btnBust, "BUST", () => gmPost("bust"));

    // VOID — tap-to-confirm, then open reason overlay
    makeTapConfirm(btnVoid, "VOID", () => openVoidOverlay());

    // FORCE RESET — tap-to-confirm
    makeTapConfirm(btnForceReset, "FORCE RESET", () => gmPost("force-reset"));

    /* --- Assisted overlay --- */
    btnConfirm.addEventListener("click", () => gmPost("confirm-break"));

    /* -----------------------------------------------------------------------
       Room lights (DMX ch3 entrance / ch4 left / ch5 right)

       The toggle covers the MAZE lights only. The entrance is marked always_on
       in config and the server refuses to switch it off — a dark container
       with an unlit way out is not a state this console can create.
    ----------------------------------------------------------------------- */
    const hLightsLed = document.getElementById("hLightsLed");
    const hLightsLabel = document.getElementById("hLightsLabel");
    let lightsOn = true;

    function renderLights(d) {
      if (!d || !d.available) {
        setLed(hLightsLed, "warn");
        hLightsLabel.textContent = "Lights n/a";
        return;
      }
      // Track the work-light override, not the live level: during ATTRACT the
      // cue pulses the lights, so the measured level swings and the button
      // would flicker between ON and OFF while nobody touched it.
      lightsOn = (d.work_lights !== null && d.work_lights !== undefined)
                 ? !!d.work_lights : !!d.maze_on;
      setLed(hLightsLed, lightsOn ? "ok" : "off");
      hLightsLabel.textContent = lightsOn ? "Work lights" : "Show lights";
    }

    async function refreshLights() {
      try { renderLights(await (await fetch("/api/gm/lights")).json()); }
      catch (e) { setLed(hLightsLed, "warn"); }
    }

    document.getElementById("hLightsToggle").addEventListener("click", async () => {
      try {
        const r = await fetch("/api/gm/lights", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ on: !lightsOn }),
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        renderLights(await r.json());
      } catch (e) { alert(`Lights failed: ${e.message}`); }
    });

    refreshLights();
    setInterval(refreshLights, 5000);

    /* --- Hazer controls --- */
    const hHazerLed = document.getElementById("hHazerLed");
    const hHazerLabel = document.getElementById("hHazerLabel");
    const hHazerLevel = document.getElementById("hHazerLevel");

    function updateHazerUI(d) {
      hHazerLed.className = "health-led " + (d.enabled ? "ok" : "off");
      // "Haze", not "Hazer": the machine and its blower stay running either
      // way. This switch only gates haze volume on DMX ch2.
      hHazerLabel.textContent = d.enabled ? "Haze ON" : "Haze OFF";
      // Read-only. Shows what ON means so the operator can tell the switch is
      // doing something, without handing them a control they should not have
      // mid-session. Change it in config/hardware.yaml or on /admin.
      hHazerLevel.textContent = d.enabled ? `${d.haze}/255` : "";
      // The DMX node is the Art-Net target the hazer sits on, so its health is
      // the hazer link. Art-Net is fire-and-forget UDP: "ok" means we are
      // transmitting without a socket error, not that the node acknowledged.
      setLed(hDmxLed, d.link_ok === false ? "err" : "ok");
    }

    document.getElementById("hHazerToggle").addEventListener("click", async () => {
      try {
        const resp = await fetch("/api/gm/hazer-toggle", { method: "POST" });
        updateHazerUI(await resp.json());
      } catch (e) { console.error("Hazer toggle failed:", e); }
    });

    // Hazer + DMX node state. Polled, not one-shot: the DMX LED used to be set
    // to "warn" at init and never touched again, so it sat amber forever even
    // with the node up.
    function refreshHazer() {
      fetch("/api/gm/hazer").then(r=>r.json()).then(d => {
        if (d.available) updateHazerUI(d);
        else {
          hHazerLed.className = "health-led warn";
          hHazerLabel.textContent = "Haze N/A";
          setLed(hDmxLed, "warn");
        }
      }).catch(() => {
        hHazerLed.className = "health-led warn";
        setLed(hDmxLed, "warn");
      });
    }
    refreshHazer();
    setInterval(refreshHazer, 5000);
    btnVeto.addEventListener("click",    () => gmPost("veto-break"));

    /* --- Detection mode switcher --- */
    document.querySelectorAll(".seg-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const mode = btn.dataset.mode;
        if (mode === currentDetection) return;
        gmPost("detection-mode", { mode });
      });
    });

    /* -----------------------------------------------------------------------
       WebSocket
    ----------------------------------------------------------------------- */
    let ws = null;
    let wsDelay = 1000;
    let wsDisconnectTimer = null;
    const wsDisconnectBanner = document.getElementById("wsDisconnectBanner");

    function connectWS() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);

      ws.onopen = () => {
        wsDot.className = "ws-dot ok";
        wsLabel.textContent = "live";
        wsDelay = 1000;
        // Hide disconnect banner on reconnect
        if (wsDisconnectTimer) { clearTimeout(wsDisconnectTimer); wsDisconnectTimer = null; }
        wsDisconnectBanner.classList.remove("visible");
      };

      ws.onmessage = (evt) => {
        __noteMessage();
        let msg;
        try { msg = JSON.parse(evt.data); } catch { return; }
        applyState(msg);
      };

      ws.onclose = () => {
        // Freeze the clock. Both displays already do this, with the comment
        // "A frozen clock is honest. A running one is a lie." — the GM console
        // did not, so an iPad that lost wifi mid-run kept extrapolating from
        // performance.now() with no server left to correct it, and after an
        // iPad sleep it showed hours.
        swRunning = false;
        stopInterpolation();
        wsDot.className = "ws-dot err";
        wsLabel.textContent = "reconnecting…";
        // Show "CONNECTION LOST" banner after 5 seconds of disconnect
        if (!wsDisconnectTimer) {
          wsDisconnectTimer = setTimeout(() => {
            wsDisconnectBanner.classList.add("visible");
          }, 5000);
        }
        setTimeout(connectWS, wsDelay);
        wsDelay = Math.min(wsDelay * 2, 10000);
      };

      ws.onerror = () => ws.close();
    }

    connectWS();

    /* Issue 4: Fetch beam list from /api/admin/beams on load.
       Issue 6: Fetch recent runs from /api/admin/runs on load. */

    // Set camera and DMX LEDs to "warn" (unknown) on init — issue 51
    setLed(hCameraLed, "warn");
    setLed(hDmxLed,    "warn");

    /* -----------------------------------------------------------------------
       End-of-day export

       The CSV carries surname, email and date of birth, so this is the one GM
       action that asks for the admin password. Everything else on this console
       is deliberately passwordless; handing out personal data on the venue wifi
       is not. The password is hashed here and never stored — a token is minted
       for the download and the hash is discarded.
    ----------------------------------------------------------------------- */
    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf))
        .map(b => b.toString(16).padStart(2, "0")).join("");
    }

    document.getElementById("btnExportDay").addEventListener("click", async () => {
      const pw = window.prompt("Admin password — the export contains personal details");
      if (!pw) return;
      const btn = document.getElementById("btnExportDay");
      const label = btn.textContent;
      btn.textContent = "…";
      btn.disabled = true;
      try {
        const hash = await sha256Hex(pw);
        const resp = await fetch("/api/admin/download-token", {
          method: "POST", headers: { "X-Admin-Password": hash },
        });
        if (!resp.ok) throw new Error(resp.status === 403 ? "wrong password"
                                                         : `HTTP ${resp.status}`);
        const { token } = await resp.json();
        window.location = `/api/admin/export/day.csv?token=${encodeURIComponent(token)}`;
      } catch (e) {
        alert(`Export failed: ${e.message}`);
      } finally {
        btn.textContent = label;
        btn.disabled = false;
      }
    });

    fetchRecentRuns();
  
    /* -----------------------------------------------------------------------
       Stale-data watchdog

       onclose is not enough. If the server's broadcaster task dies, or the path
       half-opens, every socket stays "healthy" and the screen freezes silently
       on its last frame — in front of a player, for as long as nobody notices.
       Track time since the last message and force a reconnect when it lapses.
    ----------------------------------------------------------------------- */
    let __lastMsgAt = Date.now();
    function __noteMessage() { __lastMsgAt = Date.now(); }
    setInterval(() => {
      // The server broadcasts at 10 Hz; 3 s of silence is not a slow frame.
      if (Date.now() - __lastMsgAt > 3000) {
        try { if (ws && ws.readyState === WebSocket.OPEN) ws.close(); } catch (e) {}
      }
    }, 1000);
  </script>
</body>
</html>
