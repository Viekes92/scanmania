# hardware.yaml — physical topology: relay boards, cameras, network
#
# Layout: 45 laser curtain strips, 9 rows × 5 strips per row.
#   Addressing: row(1-9) + strip(1-5) → e.g. "11", "24", "95"
#   Per row: 1=H-top-left, 2=V-left, 3=H-center, 4=V-right, 5=H-top-right
#
# 3 boards × 16 channels (15 used, ch 16 spare).
# Protocol: Modbus RTU over TCP (transparent mode), port 4196.

relay_boards:
  - id: SM-NODE-1
    ip: "172.16.0.101"
    port: 4196
    channels: 16
    timeout_ms: 200
    note: "segment 1 — rows 1–3 (15 strips, ch 16 spare)"

  - id: SM-NODE-2
    ip: "172.16.0.102"
    port: 4196
    channels: 16
    timeout_ms: 200
    note: "segment 2 — rows 4–6 (15 strips, ch 16 spare)"

  - id: SM-NODE-3
    ip: "172.16.0.103"
    port: 4196
    channels: 16
    timeout_ms: 200
    note: "segment 3 — rows 7–9 (15 strips, ch 16 spare)"

# Eight ceiling-facing Ajax cameras, RTSP on port 8554, h264 @ 25 fps,
# MAIN stream 1920x1080, VBR capped at 4096 kbps.
#
# The path suffix -0_m is the MAIN stream; -0_s is the sub. Main was configured
# down to 1024x576, which put a laser dot at only 4-5 px radius — measurably the
# cause of dots detecting intermittently, since the ones that flickered were
# exactly the 4 px ones. Bitrate was raised with the resolution: a dot is a
# small high-frequency feature and that is the first thing a starved h264
# encoder throws away.
#
# Naming is SM-CAM-<side><n>: side 1 is the left row of the container, side 2
# the right. Full ceiling coverage, so every dot is close to some camera — that
# is what makes per-camera tuning tractable. Detection params are per camera
# (beams.json, mazes.<name>.cameras.<cam>.params) because the top-hat kernel has
# to be larger than a dot and smaller than the dot spacing, and both scale with
# distance to the ceiling.
#
# IPs are static: .21x on the left side, .22x on the right.
#
# The trailing MAC-derived path is the camera's identity — it is the one thing
# that cannot be reconfigured from the camera UI. If a stream stops opening,
# check the path before the address.
#
# The '@' in the password must stay percent-encoded as %40, or the URL splits at
# the wrong place and the host parses as "ssw0rd123_".
#
# w/h below is the substream resolution these cameras are SET to. ROIs in
# beams.json are frame pixels, so changing it in a camera UI silently
# invalidates every saved dot. tools/capture.py records what it actually
# measured and errors if it disagrees with this.
cameras:
  # ---- left side ----
  - id: SM-CAM-11
    url: "rtsp://scanmania:P%40ssw0rd123_@172.16.0.211:8554/9c756e2e94bb-0_m"
