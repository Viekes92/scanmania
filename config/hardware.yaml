# hardware.yaml — physical topology: relay boards, cameras, network
#
# Layout: 45 laser curtain strips, 9 rows × 5 strips per row.
#   Addressing: row(1-9) + strip(1-5) → e.g. "11", "24", "95"
#   Per row: 1=H-top-left, 2=V-left, 3=H-center, 4=V-right, 5=H-top-right
#
# 3 boards × 16 channels (15 used, ch 16 spare).
# Protocol: Modbus RTU over TCP (transparent mode), port 4196.

relay_boards:
  - id: SM-NODE-1
    ip: "172.16.0.101"
    port: 4196
    channels: 16
    timeout_ms: 200
    note: "segment 1 — rows 1–3 (15 strips, ch 16 spare)"

  - id: SM-NODE-2
    ip: "172.16.0.102"
    port: 4196
    channels: 16
    timeout_ms: 200
    note: "segment 2 — rows 4–6 (15 strips, ch 16 spare)"

  - id: SM-NODE-3
    ip: "172.16.0.103"
    port: 4196
    channels: 16
    timeout_ms: 200
    note: "segment 3 — rows 7–9 (15 strips, ch 16 spare)"

# Four ceiling-facing Ajax cameras, RTSP on port 8554, h264 @ 25 fps.
#
# The trailing MAC-derived path is the STABLE identity of a camera; the IP is
# not — these are DHCP and have moved between addresses mid-session. If a stream
# stops opening, run `python3 tools/camshow.py 1 --probe` to re-derive which
# address serves which path, and correct the IPs here.
#
# The '@' in the password must stay percent-encoded as %40, or the URL splits at
# the wrong place and the host parses as "ssw0rd123_".
#
# Substream resolution is changeable from the camera UI and has been seen at
# both 1024x576 and 1920x1080. ROIs in beams.json are frame pixels, so a
# resolution change silently invalidates every one of them — capture_w/capture_h
# on each beam record what they were measured at.
cameras:
  - id: cam_1
    url: "rtsp://scanmania:P%40ssw0rd123_@172.16.0.201:8554/9c756e2e94bb-0_m"
    reference_frame: "ref/cam_1.png"
    note: "ceiling-facing"
  - id: cam_2
    url: "rtsp://scanmania:P%40ssw0rd123_@172.16.0.202:8554/9c756e2e9aad-0_m"
    reference_frame: "ref/cam_2.png"
    note: "ceiling-facing"
  - id: cam_3
    url: "rtsp://scanmania:P%40ssw0rd123_@172.16.0.203:8554/9c756e2e91c0-0_m"
    reference_frame: "ref/cam_3.png"
    note: "ceiling-facing"
  - id: cam_4
    url: "rtsp://scanmania:P%40ssw0rd123_@172.16.0.204:8554/9c756e2e9121-0_m"
    reference_frame: "ref/cam_4.png"
    note: "ceiling-facing"

network:
  subnet: "172.16.0.0/24"
  nuc_ip: "172.16.0.1"
  web_port: 8000

inputs:
  id: SM-NODE-TRIG
  ip: "172.16.0.100"
  port: 502               # Standard Modbus TCP (not RTU-over-TCP like relay boards)
  poll_ms: 50
  timeout_ms: 200
  num_inputs: 4
  # Input number → event mapping (0-indexed, matches Opta I1-I4)
  # 0=start plate, 1=checkpoint 1, 2=checkpoint 2, 3=stop button
  input_map:
    0: plate
    1: cp1
    2: cp2
    3: stop
  note: "Arduino Opta AFX00001 — 4 opto-isolated digital inputs, Modbus TCP"

hazer:
  artnet_ip: "172.16.0.104"    # ShowTec NET-2/3 (SM-NODE-DMX)
  universe: 1
  fan_channel: 1               # DMX ch1 = blower speed (0-255)
  haze_channel: 2              # DMX ch2 = haze volume (0-255)
  default_fan: 255             # 0-255 (blower always on for haze distribution)
  # Haze output while the GM switch is ON. 0-255, but the useful range is
  # tiny: measured in the container, 1% (DMX 2-3) gives sustained haze that
  # lasts. Anything higher fogs the space out and washes the laser dots.
  # The GM console has an on/off switch only; this is the amount it turns on.
  # Tune here or live on /admin — do not put a slider back on the GM console.
  default_haze: 3              # 0-255 (~1%)
  enabled: true
