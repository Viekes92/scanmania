shows:
  attract:
    description: "idle sparkle \u2014 the grid lit, a few channels winking out"
    loop: true
    steps:
    - preset: all_on
      sparkle_off: 4
      hold_ms: 1800
    - preset: all_on
      sparkle_off: 6
      hold_ms: 1800
    - preset: all_on
      sparkle_off: 3
      hold_ms: 2200
    - preset: all_on
      sparkle_off: 7
      hold_ms: 1800
  bust:
    loop: false
    description: "busted \u2014 horizontals flash, then bar the maze"
    steps:
    - preset: horizontal
      hold_ms: 90
    - preset: blackout
      hold_ms: 90
    - preset: horizontal
      hold_ms: 90
    - preset: blackout
      hold_ms: 90
    - preset: horizontal
      hold_ms: 90
