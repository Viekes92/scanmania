# game.yaml — timings, detection mode, and count-in configuration
# This is the file people will edit on site. Every key has a comment.

# Come up in MASTER MODE rather than ATTRACT, with the house lights up and the
# lasers dark. The GM walks the container, then presses FORCE RESET on the
# console to drop into game mode.
#
# The point is that nothing is playable until a human has been inside. A box
# that boots straight into its attract show after a power cut invites someone
# to start a run before anyone has looked at the maze.
#
# false = boot straight to ATTRACT (the old behaviour).
boot_to_master: true

mode: hard_cutoff
# hard_cutoff: a confirmed break ends the run immediately. Only option in v1.

# How long the GM has to CONFIRM or VETO an assisted-mode break before the
# system decides for them. Without a deadline an undecided halt wedges the game
# in a RUN state with every timer cancelled.
#
# On timeout the run ABORTS — it does not count, and the player runs again.
# Not bust (that convicts someone nobody looked at) and not veto (which re-arms
# detection on a player still standing in the beam, and loops forever).
# Range: 10000-300000
assisted_timeout_ms: 60000

# How long a signed-in player may stand around before the run is cancelled and
# the attract show comes back. Range: 30000-600000
registered_timeout_ms: 180000

max_run_ms: 180000
# Maximum run duration in ms before the run is auto-aborted. Range: 60000-600000.

# How long to keep probing the relay boards at BOOT before declaring FAULT.
# The router takes about two minutes from cold and the NUC is ready long before
# it, so at boot "unreachable" means "not up yet", not "broken" — and FAULT can
# only be left with FORCE RESET on the iPad. Coming back from MASTER uses a
# short fixed window instead, because there the hardware was working a minute
# ago. Sane range 0-600 s.
self_test_boot_timeout_s: 180
# Gap between probes. Range 1-30 s.
self_test_retry_s: 5

result_display_ms: 15000
# How long to show the result screen (FINISHED or BUSTED) before resetting. Range: 5000-30000.

arm_timeout_ms: 180000
# How long to wait in ARM state (player registered but never counted in) before auto-resetting. Range: 30000-600000.

detection_mode: assisted
# Default detection mode: auto | assisted | manual. Start with 'assisted' on site; switch to 'auto' once trusted.
# Switchable live from the GM console without restarting.

show: main_game
# Which show from mazes.yaml to run. Must match a key under 'shows'.

count_in:
  preset: maze_1

  # What the 3-2-1 ramp FLASHES. Deliberately not the maze that will be lit at
  # GO: players read a flash of the real shape as "go now" and start early.
  # Flashing the whole grid carries no information about the route.
  #
  # Safe because nothing measures a baseline during the ramp — runtime
  # baselines come from beams.json, and the FSM applies maze_1 at GO before
  # detection is armed. (baseline_pulse_index below is parsed and unused.)
  flash_preset: all_on
  # MUST match the preset that will be active at GO. The baseline is captured against this preset.
  # Changing this without changing maze_1 in mazes.yaml is a bug. See plan.md §4.3.

  # The spoken "3-2-1" lives in game.mp3, not in a cue, and it does not start
  # at zero: the words land at 4.0 s, 5.15 s and 6.05 s, with GO at 7.0 s.
  # So the bed starts when the GM taps COUNT IN and the visual ramp waits this
  # long before beginning, putting GO at audio_lead_ms + 3000 = 7000 ms.
  #
  # Tune BY EAR against the track, not by arithmetic — mixer start-up latency
  # is part of the offset. Nothing in the game waits on the audio: if the file
  # is missing the ramp still takes exactly as long and GO still lands on time.
  # 0 restores the old instant ramp. Range 0-10000 ms.
  audio_lead_ms: 4000

  ready_blink_ms: 150
  # Duration of the silent "system ready" blink at ARM. Doubles as the pre-flight beam check window.
  # Range: 100-300.

  baseline_pulse_index: 0
  # Index into the pulses list below that is used for baseline capture (the longest "on" window).
  # Do not change unless the pulse list is reordered.

  pulses:
    # [on_ms, off_ms] — regenerate the curve with tools/ramp.py, then hand-tune the tail.
    # The relay clatter IS the sound design. These timings drive that ramp.
    #
    # Total MUST stay ~3000 ms: the in-container display counts real seconds down
    # from the GO deadline, so a shorter ramp shows "3, 2, 1" faster than 1 Hz and
    # a longer one starts at 4. Sum the column after any edit.
    - [480, 370]   # pulse 0 — longest, baseline captured here.  850   "3"
    - [420, 330]   #                                            1600   "2"
    - [280, 220]   #                                            2100
    - [210, 170]   #                                            2480   "1"
    - [130, 110]   #                                            2720
    - [ 85,  65]   #                                            2870
    - [ 50,  40]   #                                            2960
    - [ 22,  18]   #                                            3000 = GO

  solid_at_end: true
  # If true, after the last pulse the preset stays solid (GO state). Always true for normal play.

arm_grace_ms: 150
# Ignore break events for this many ms after detection arms at GO.
# Must match detection.arm_grace_ms in beams.json (both are checked; the smaller wins).
# Range: 50-500.

leaderboard:
  scope: daily
  # daily: reset at midnight. activation: entire event. all: never reset.

  show_busted: false
  # Whether busted runs appear on the public leaderboard. Admins always see all runs.

  max_entries: 20
  # Maximum entries shown on the outdoor display leaderboard.

# Minutes between automatic DB snapshots. 0 disables the rolling loop.
# Sane range 5-240. Manual snapshots (/admin) and the on-stop snapshot are
# unaffected. Before this was wired, an unclean shutdown lost everything back
# to the last time someone pressed the button.
snapshot_interval_min: 60

# How many rolling snapshots to keep on disk. Sane range 4-200.
snapshot_keep: 48

# Grace after a maze shape change before newly-lit channels can report a break.
# Those lasers are physically still coming on, so a dark reading means nothing
# yet. Channels lit in both the old and new shape are NOT paused — they keep
# being watched straight through the transition. Sane range 100-500 ms.
# Pause between a checkpoint firing and the maze taking its next shape. The
# player is stepping over the checkpoint as it fires, and a shape that changes
# under their feet is both startling and unfair.
#
# The OLD shape stays lit and watched during this window — the player is still
# in the container and those beams are still real. 0 restores the old
# snap-immediately behaviour. Sane range 0-1000 ms.
checkpoint_shape_delay_ms: 300

preset_settle_ms: 800

# ---------------------------------------------------------------------------
# Audio — the container's soundtrack.
#
# Files are .wav under sounds_dir and are swapped by dropping a new file in and
# keeping the name, or by changing the name here. A name that does not resolve
# is a log line and silence, never a crash: audio is decoration and must never
# be able to end a run.
#
# music: the looping bed, keyed by FSM state. A state NOT listed here keeps
#   whatever is already playing -- that is what carries one track across
#   RUN_SEG_1 -> 2 -> 3 without restarting it at every checkpoint. Ask for
#   quiet by name with `silence`.
# cues: one-shots fired once on ENTERING a state, layered over the bed.
# ---------------------------------------------------------------------------
audio:
  enabled: true
  # "" = whatever the OS calls the default device. Set a name to pin it to one
  # output (`aplay -L` on the NUC lists them) so a plugged-in HDMI cannot steal
  # the sound halfway through a tour.
  device: ""
  sounds_dir: sounds
  # Formats: the BED streams, so a long track belongs in .mp3 or .ogg -- 8
  # hours of .wav is 5 GB. CUES are decoded into RAM at startup and must fire
  # instantly, so keep those short .wav. .ogg loops gaplessly where .mp3 has a
  # few ms of encoder padding; irrelevant under a crossfade, audible on a hard
  # loop point.
  music_volume: 0.6        # 0.0-1.0
  cue_volume: 0.9          # 0.0-1.0
  fade_ms: 400             # crossfade when the bed changes. 0-5000.

  music:
    ATTRACT:    ambient.mp3      # idle box, nobody playing
    REGISTERED: ambient.mp3      # player signed in, still idle
    ARM:        ambient.mp3
    # game.mp3 starts the moment the GM taps COUNT IN and carries the spoken
    # 3-2-1 itself, which is why count_in.audio_lead_ms exists. RUN_SEG_* are
    # deliberately NOT listed: an unlisted state keeps whatever is playing, so
    # the same track runs unbroken from the count-in through all three
    # segments. Relisting it would also work, but only because restarting the
    # same file is a no-op — leaving it out says the intent.
    COUNTDOWN:  game.mp3
    # Stop pressed. Switching the bed here is what stops game.mp3.
    FINISHED:   end.mp3
    BUSTED:     end.mp3          # until the time penalty replaces instant bust
    ABORTED:    silence          # run cut short — no fanfare
    RESULT:     ambient.mp3      # back to the bed while the score is up
    MASTER:     silence          # GM is working in the box
    FAULT:      silence

  cues:
    # No COUNTDOWN cue: the 3-2-1 is inside game.mp3.
    # No victory/defeat cue either — a run can only be won now, and end.mp3
    # covers the moment on its own.
    RUN_SEG_2:  sector.wav       # checkpoint 1 reached
    RUN_SEG_3:  sector.wav       # checkpoint 2 reached
