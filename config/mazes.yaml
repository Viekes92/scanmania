shows:
  attract:
    loop: false
    description: solid all-on during idle (design a show later)
    steps:
    - preset: all_on
      hold_ms: 999999
  bust:
    loop: true
    description: "rapid flash \u2014 plays on BUSTED"
    steps:
    - preset: all_on
      hold_ms: 150
    - preset: blackout
      hold_ms: 150
  clean:
    loop: true
    description: "celebration \u2014 plays on FINISHED (clean run)"
    steps:
    - preset: all_on
      hold_ms: 400
    - preset: blackout
      hold_ms: 100
  main_game:
    segments:
    - maze_1
    - maze_2
    - maze_3
    description: the three mazes in order
  test_show:
    steps:
    - preset: all_on
      hold_ms: 200
    loop: true
