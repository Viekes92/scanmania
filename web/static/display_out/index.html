<!DOCTYPE html>
<!--
  web/static/display_out/index.html — the public-facing screen (HDMI-2).

  PORTRAIT, 9:16. Deliberately: people photograph it with a phone, and a
  portrait frame is what they can actually post. The physical panel has to be
  rotated and X told about it — see docs/deployment.md. The layout still works
  landscape, it just loses the tall middle.

  Reading order is fixed top to bottom: logo, the running clock, the stage
  (camera feed when the back cam lands — plan.md §18), then the leaderboard and
  the sponsor lockup along the bottom. That bottom strip is the part that ends
  up in the photo, so it never moves.

  Brand tokens and the Proxima Nova faces come from /static/shared/brand.css.

  The stopwatch is interpolated between broadcasts and hard-corrected on every
  message (invariant 2). Nothing here computes a duration from wall clock.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScanMania — Public display</title>
  <link rel="stylesheet" href="/static/shared/brand.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--sm-black);
      color: #fff;
      font-family: var(--sm-font);
      overflow: hidden;
      cursor: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Portrait artwork. Landscape panels get the horizontal cut instead, so a
       mis-rotated screen still looks deliberate rather than stretched. */
    .sm-lasers { background-image: url("/static/shared/scanmania-design/lasers-v.png"); }
    @media (orientation: landscape) {
      .sm-lasers { background-image: url("/static/shared/scanmania-design/lasers-h.png"); }
    }

    #stage {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 3.2vh 4vw;
      gap: 1vh;
    }

    /* ---- header: logo + clock ------------------------------------------ */
    .logo { width: min(74vw, 900px); display: block; margin: 0 auto; }

    .clock {
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      font-size: clamp(44px, 13vw, 190px);
      line-height: 1;
      text-align: center;
      margin-top: 0.6vh;
    }
    .clock .mm { color: var(--sm-blue); }
    .clock .ss { color: var(--sm-red); }

    /* ---- the middle: camera stage + overlays ---------------------------- */
    #centre {
      position: relative;
      min-height: 0;               /* let the 1fr row actually shrink */
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    #mjpegBg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }
    #mjpegBg.hidden { display: none; }

    .overlay {
      position: relative;
      z-index: 2;
      display: none;
      text-align: center;
      width: 100%;
    }
    .overlay.visible { display: block; }

    .verdict {
      font-weight: 900;
      font-size: clamp(48px, 17vw, 260px);
      line-height: 0.9;
      letter-spacing: -0.01em;
    }
    .verdict.win  { color: var(--sm-blue); }
    .verdict.lose { color: var(--sm-red); }

    .sub {
      font-weight: 800;
      font-size: clamp(20px, 5.4vw, 80px);
      color: #fff;
      margin-top: 1vh;
      word-break: break-word;
    }
    .sub.blue { color: var(--sm-blue); }

    .cd-number {
      font-weight: 900;
      font-size: clamp(120px, 46vw, 700px);
      line-height: 0.85;
      color: var(--sm-red);
      font-variant-numeric: tabular-nums;
    }

    #nextUpBanner {
      display: none;
      text-align: center;
    }
    #nextUpBanner.visible { display: block; }
    .eyebrow {
      font-weight: 700;
      font-size: clamp(13px, 3vw, 40px);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--sm-blue);
    }

    /* ---- footer: leaderboard + sponsor ---------------------------------
       Fixed height and fixed position. This strip is what ends up in the
       photo, so it must not jump when a name is longer or a row is missing. */
    #footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 3vw;
      padding-top: 1.5vh;
    }

    #leaderboard .title {
      font-weight: 800;
      font-size: clamp(13px, 3.2vw, 42px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sm-blue);
      margin-bottom: 0.6vh;
    }
    .lb-row {
      font-weight: 700;
      font-size: clamp(14px, 3.6vw, 48px);
      line-height: 1.32;
      color: var(--sm-blue);
      display: flex;
      gap: 0.5em;
      white-space: nowrap;
    }
    .lb-row .pos { font-weight: 800; }
    .lb-row .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 46vw;
    }
    .lb-row .tm {
      margin-left: auto;
      color: var(--sm-red);
      font-variant-numeric: tabular-nums;
    }
    .lb-row.top .nm { text-transform: uppercase; }
    .lb-empty { color: var(--sm-dim); font-weight: 700;
                font-size: clamp(13px, 3vw, 38px); }

    #sponsor { width: min(26vw, 300px); display: block; }

    /* ---- connection badge ----------------------------------------------- */
    #reconnect {
      position: fixed;
      left: 1.4vw; top: 1.2vh;
      z-index: 4;
      display: none;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sm-red);
      border: 2px solid var(--sm-red);
      padding: 4px 10px;
    }
    #reconnect.visible { display: block; }
  </style>
</head>
<body>

<div class="sm-lasers"></div>

<div id="stage">

  <!-- header -->
  <img class="logo" id="gameName" src="/static/shared/scanmania-design/sm-text-tp.png" alt="ScanMania">
  <div class="clock" id="stopwatch"><span class="mm">00:</span><span class="ss">00.00</span></div>

  <!-- middle: camera stage, with state overlays on top -->
  <div id="centre">
    <img id="mjpegBg" class="hidden" alt="">

    <div class="overlay" id="nextUpBanner">
      <div class="eyebrow">Next up</div>
      <div class="sub" id="nextUpName"></div>
    </div>

    <div class="overlay" id="countdownOverlay">
      <div class="cd-number" id="cdNumber">3</div>
    </div>

    <div class="overlay" id="bustOverlay">
      <div class="verdict lose">BUSTED</div>
      <div class="sub" id="bustTime"></div>
    </div>

    <div class="overlay" id="finishedOverlay">
      <div class="verdict win" id="finishedClean">CLEAN RUN</div>
      <div class="sub" id="finishedTime"></div>
      <div class="sub blue" id="finishedRank"></div>
    </div>

    <div class="overlay" id="abortedOverlay">
      <div class="verdict lose">RUN ENDED</div>
      <div class="sub" id="abortedTime"></div>
    </div>
  </div>

  <!-- footer -->
  <div id="footer">
    <div id="leaderboard">
      <div class="title">Leaderboard</div>
      <div id="lbRows"><div class="lb-empty">No runs yet</div></div>
    </div>
    <img id="sponsor" src="/static/shared/scanmania-design/cf.png" alt="Carrefour">
  </div>

</div>

<div id="reconnect">Reconnecting</div>

<script>
  "use strict";

  const RUN_STATES = new Set(["RUN_SEG_1", "RUN_SEG_2", "RUN_SEG_3"]);
  const LB_ROWS = 5;

  /* The back cam is not wired yet — plan.md §18. It is a separate,
     non-detection camera aimed at the play area; the ceiling cameras must
     never be shown here, their view is a grid of dots. Requesting a port
     nothing listens on fired a failed connection every 15 s for the whole
     tour, so nothing is requested until there is something to request. */
  const BACK_CAM_URL = null;

  const stopwatch     = document.getElementById("stopwatch");
  const mjpegBg       = document.getElementById("mjpegBg");
  const nextUpBanner  = document.getElementById("nextUpBanner");
  const nextUpName    = document.getElementById("nextUpName");
  const countdownOv   = document.getElementById("countdownOverlay");
  const cdNumber      = document.getElementById("cdNumber");
  const bustOverlay   = document.getElementById("bustOverlay");
  const bustTime      = document.getElementById("bustTime");
  const finishedOv    = document.getElementById("finishedOverlay");
  const finishedClean = document.getElementById("finishedClean");
  const finishedTime  = document.getElementById("finishedTime");
  const finishedRank  = document.getElementById("finishedRank");
  const abortedOv     = document.getElementById("abortedOverlay");
  const abortedTime   = document.getElementById("abortedTime");
  const lbRows        = document.getElementById("lbRows");
  const reconnect     = document.getElementById("reconnect");

  const OVERLAYS = [nextUpBanner, countdownOv, bustOverlay, finishedOv, abortedOv];
  function showOverlay(el) {
    for (const o of OVERLAYS) o.classList.toggle("visible", o === el);
  }

  /* -----------------------------------------------------------------------
     Stopwatch — see display_in for the reasoning. Invariant 2.
  ----------------------------------------------------------------------- */
  let swElapsedAtMsg = 0, swClientAtMsg = 0, swRunning = false, rafId = null;

  function fmtParts(ms) {
    if (ms == null || isNaN(ms)) ms = 0;
    const total = Math.max(0, Math.floor(ms));
    const m  = Math.floor(total / 60000);
    const s  = Math.floor((total % 60000) / 1000);
    const cs = Math.floor((total % 1000) / 10);
    return [
      String(m).padStart(2, "0") + ":",
      String(s).padStart(2, "0") + "." + String(cs).padStart(2, "0"),
    ];
  }
  function fmtFlat(ms) { const p = fmtParts(ms); return p[0] + p[1]; }

  function setClock(el, ms) {
    const [mm, ss] = fmtParts(ms);
    let a = el.querySelector(".mm"), b = el.querySelector(".ss");
    if (!a || !b) {
      el.textContent = "";
      a = document.createElement("span"); a.className = "mm";
      b = document.createElement("span"); b.className = "ss";
      el.append(a, b);
    }
    if (a.textContent !== mm) a.textContent = mm;
    if (b.textContent !== ss) b.textContent = ss;
  }

  function interpolated() {
    if (!swRunning) return swElapsedAtMsg;
    return swElapsedAtMsg + (performance.now() / 1000 - swClientAtMsg) * 1000;
  }
  function tick() {
    setClock(stopwatch, interpolated());
    rafId = swRunning ? requestAnimationFrame(tick) : null;
  }
  function startInterpolation() { if (!rafId) rafId = requestAnimationFrame(tick); }
  function stopInterpolation()  { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

  /* -----------------------------------------------------------------------
     Leaderboard
  ----------------------------------------------------------------------- */
  let lastLeaderboardSig = null;

  function renderLeaderboard(entries) {
    const top = (entries || []).slice(0, LB_ROWS);
    lbRows.textContent = "";
    if (!top.length) {
      const d = document.createElement("div");
      d.className = "lb-empty";
      d.textContent = "No runs yet";
      lbRows.append(d);
      return;
    }
    top.forEach((e, i) => {
      // Built with textContent, never innerHTML: a nickname is public input
      // and this screen faces the street.
      const row = document.createElement("div");
      row.className = "lb-row" + (i === 0 ? " top" : "");
      const pos = document.createElement("span"); pos.className = "pos";
      pos.textContent = (i + 1) + ".";
      const nm = document.createElement("span"); nm.className = "nm";
      nm.textContent = e.player_nickname || "—";
      const tm = document.createElement("span"); tm.className = "tm";
      tm.textContent = e.elapsed_ms != null ? fmtFlat(e.elapsed_ms) : "";
      row.append(pos, nm, tm);
      lbRows.append(row);
    });
  }

  async function seedLeaderboard() {
    try {
      const r = await fetch("/api/admin/leaderboard");
      if (!r.ok) return;
      const d = await r.json();
      const rows = Array.isArray(d) ? d : (d.leaderboard || d.runs || []);
      // No length guard: a reload during the morning window before the first
      // clean run must show an empty board, not silently keep whatever the
      // previous render left on a screen the public photographs.
      lastLeaderboardSig = JSON.stringify(rows.slice(0, LB_ROWS));
      renderLeaderboard(rows);
    } catch (e) { /* the board simply stays empty */ }
  }

  /* -----------------------------------------------------------------------
     State
  ----------------------------------------------------------------------- */
  function applyState(msg) {
    const state = msg.state || "ATTRACT";

    swElapsedAtMsg = msg.elapsed_ms || 0;
    swClientAtMsg  = performance.now() / 1000;

    if (RUN_STATES.has(state)) {
      swRunning = true;
      startInterpolation();
      showOverlay(null);

    } else {
      swRunning = false;
      stopInterpolation();
      setClock(stopwatch, swElapsedAtMsg);

      if (state === "REGISTERED" || state === "ARM") {
        nextUpName.textContent = msg.player_nickname || "—";
        showOverlay(nextUpBanner);

      } else if (state === "COUNTDOWN") {
        cdNumber.textContent =
          Math.max(1, Math.ceil((msg.countdown_remaining_ms ?? 0) / 1000));
        showOverlay(countdownOv);

      } else if (state === "BUSTED") {
        bustTime.textContent = fmtFlat(swElapsedAtMsg);
        showOverlay(bustOverlay);

      } else if (state === "FINISHED" || state === "RESULT") {
        const busted = msg.outcome === "busted";
        finishedClean.textContent = busted ? "BUSTED" : "CLEAN RUN";
        finishedClean.className = "verdict " + (busted ? "lose" : "win");
        finishedTime.textContent = fmtFlat(swElapsedAtMsg);
        finishedRank.textContent = msg.rank != null ? `RANK #${msg.rank}` : "";
        showOverlay(finishedOv);

      } else if (state === "ABORTED") {
        abortedTime.textContent = fmtFlat(swElapsedAtMsg);
        showOverlay(abortedOv);

      } else {
        showOverlay(null);
      }
    }

    // Only re-render when the data actually changed. This ran on every
    // broadcast — 10x/second, forever — rebuilding the rows for a list that
    // changes a few times an hour, so the outdoor Chromium never idled. Guard
    // on length too: the server ships an empty array before the first save,
    // and a bare truthiness check wiped the board the page had just seeded.
    // Render an EMPTY board too. The && length guard meant the board could
    // never return to empty: at the 09:00 rollover the first saved run
    // re-scopes the query, and if that run was busted the broadcast carries
    // [] — which was skipped, leaving YESTERDAY's names and times on a
    // street-facing screen for the whole morning queue.
    if (Array.isArray(msg.leaderboard)) {
      const sig = JSON.stringify(msg.leaderboard.slice(0, LB_ROWS));
      if (sig !== lastLeaderboardSig) {
        lastLeaderboardSig = sig;
        renderLeaderboard(msg.leaderboard);
      }
    }
  }

  /* -----------------------------------------------------------------------
     Back-cam feed. Retry is driven by frame freshness, not by an error
     handler: a hung request never fires `error`, and Chromium does not fire
     it for a multipart stream that dies after the first part — it just
     freezes on the last frame. Both cases used to look intentional.
  ----------------------------------------------------------------------- */
  let lastFrameAt = 0;
  mjpegBg.addEventListener("load",  () => {
    lastFrameAt = Date.now();
    mjpegBg.classList.remove("hidden");
  });
  mjpegBg.addEventListener("error", () => mjpegBg.classList.add("hidden"));

  if (BACK_CAM_URL) {
    mjpegBg.src = BACK_CAM_URL;
    setInterval(() => {
      if (Date.now() - lastFrameAt > 10000) {
        mjpegBg.src = BACK_CAM_URL
          + (BACK_CAM_URL.includes("?") ? "&" : "?") + "t=" + Date.now();
      }
    }, 15000);
  } else {
    mjpegBg.removeAttribute("src");
  }

  /* -----------------------------------------------------------------------
     WebSocket
  ----------------------------------------------------------------------- */
  let ws = null;
  let wsDelay = 1000;

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      wsDelay = 1000;
      reconnect.classList.remove("visible");
      seedLeaderboard();
    };

    ws.onmessage = (evt) => {
      __noteMessage();
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }
      applyState(msg);
    };

    ws.onclose = () => {
      // A frozen clock is honest. A running one is a lie.
      swRunning = false;
      stopInterpolation();
      reconnect.classList.add("visible");
      setTimeout(connect, wsDelay);
      wsDelay = Math.min(wsDelay * 2, 10000);
    };

    ws.onerror = () => ws.close();
  }

  connect();

  /* -----------------------------------------------------------------------
     Stale-data watchdog — see display_in.
  ----------------------------------------------------------------------- */
  let __lastMsgAt = Date.now();
  function __noteMessage() { __lastMsgAt = Date.now(); }
  setInterval(() => {
    if (Date.now() - __lastMsgAt > 3000) {
      try { if (ws && ws.readyState === WebSocket.OPEN) ws.close(); } catch (e) {}
    }
  }, 1000);
</script>
</body>
</html>
