      hold_ms: 90
    - preset: vertical
      hold_ms: 90
    - preset: blackout
      hold_ms: 90
    - preset: vertical
      hold_ms: 100
  main_game:
    segments:
    - maze_1
    - maze_2
    - maze_3
    description: the three mazes in order
  test_show:
    steps:
    - preset: all_on
      hold_ms: 200
    loop: true
